<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UPP · Simulados</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1C2B39;
    --ink-soft:#3E4E5C;
    --paper:#EDEBDD;
    --paper-card:#F7F5EA;
    --paper-line:#D8D4C0;
    --pine:#2F6B5E;
    --pine-dark:#20463D;
    --pine-tint:#DCE7E1;
    --ochre:#C88A3D;
    --ochre-tint:#F3E3CB;
    --water:#3E6E8C;
    --water-tint:#DDE7ED;
    --alert:#B23B3B;
    --alert-tint:#F2DBD8;
    --white:#FFFFFF;
    --accent:#8B7CD8;
    --accent-tint:#E7E3F7;
    --radius:10px;
    --shadow: 0 1px 2px rgba(28,43,57,.06), 0 6px 18px rgba(28,43,57,.08);
    --shadow-lg: 0 4px 10px rgba(28,43,57,.07), 0 16px 34px rgba(28,43,57,.11);
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  ::selection{background:var(--accent-tint);color:var(--ink);}

  body, .question-card, .enunciado, .option, main#app{
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
  }
  input, textarea, [contenteditable="true"]{
    -webkit-user-select:text; -moz-user-select:text; user-select:text;
  }

  .brand-logo{
    display:block;
    height:40px;
    width:auto;
    filter:drop-shadow(0 2px 5px rgba(28,43,57,.18));
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 14% -6%, rgba(139,124,216,.10), transparent 42%),
      radial-gradient(circle at 100% 4%, rgba(200,138,61,.09), transparent 38%),
      repeating-radial-gradient(circle at 12% -10%, transparent 0 46px, rgba(47,107,94,.07) 47px 48px, transparent 49px 94px),
      repeating-radial-gradient(circle at 108% 10%, transparent 0 60px, rgba(200,138,61,.07) 61px 62px, transparent 63px 122px);
    background-attachment:fixed;
  }

  a{color:inherit;}

  header.site{
    padding:22px clamp(16px,4vw,48px) 0;
    max-width:1140px;
    margin:0 auto;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:16px;
    background:linear-gradient(135deg, var(--paper-card), var(--paper));
    border:1px solid var(--paper-line);
    border-radius:16px;
    padding:12px 20px;
    box-shadow:var(--shadow);
  }
  .brand svg{flex:none;}
  .brand .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    background:linear-gradient(90deg,var(--pine),var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:700;
    margin:0 0 2px;
  }
  .brand h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(24px,3.2vw,34px);
    margin:0;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  .brand .prof{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  nav.tabs{
    display:flex;
    gap:6px;
    margin:22px 0 0;
    border-bottom:1px solid var(--paper-line);
  }
  nav.tabs button{
    font-family:var(--font-mono);
    font-size:12.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    background:none;
    border:none;
    padding:11px 16px;
    cursor:pointer;
    color:var(--ink-soft);
    position:relative;
    top:1px;
    border-bottom:2px solid transparent;
    border-radius:8px 8px 0 0;
    transition:background .15s ease, color .15s ease;
  }
  nav.tabs button.active{
    color:var(--pine-dark);
    border-bottom-color:var(--pine);
    font-weight:700;
    background:rgba(47,107,94,.08);
  }
  nav.tabs button:hover{color:var(--pine-dark);background:rgba(47,107,94,.06);}


  .organized-nav{
    display:flex;
    align-items:stretch;
    gap:8px;
    flex-wrap:wrap;
    padding:10px;
    background:rgba(247,245,234,.72);
    border:1px solid var(--paper-line);
    border-radius:14px;
    box-shadow:var(--shadow);
    position:sticky;
    top:10px;
    z-index:20;
    backdrop-filter:blur(10px);
  }
  .nav-group{
    display:flex;
    align-items:center;
    gap:4px;
    padding:3px;
    border:1px solid rgba(216,212,192,.75);
    border-radius:10px;
    background:rgba(255,255,255,.38);
  }
  .nav-group-title{
    display:none;
  }
  .organized-nav button{
    white-space:nowrap;
    border-radius:8px;
    padding:9px 12px;
  }
  .organized-nav button.active{
    box-shadow:0 2px 7px rgba(28,43,57,.10);
  }
  @media (max-width:820px){
    .organized-nav{
      position:static;
      overflow-x:auto;
      flex-wrap:nowrap;
      align-items:stretch;
    }
    .nav-group{
      flex:0 0 auto;
    }
  }
  @media (max-width:560px){
    .organized-nav{
      margin-left:-4px;
      margin-right:-4px;
      padding:7px;
    }
    .organized-nav button{
      font-size:11px;
      padding:8px 10px;
    }
  }

  main#app{
    max-width:1100px;
    margin:0 auto;
    padding:28px clamp(16px,4vw,48px) 80px;
  }

  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .section-head h2{
    font-family:var(--font-display);
    font-size:22px;
    margin:0;
    font-weight:600;
  }
  .muted{color:var(--ink-soft);}
  .badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:100px;
    font-weight:700;
  }
  .badge.on{background:var(--pine-tint);color:var(--pine-dark);}
  .badge.off{background:#E7E4D6;color:var(--ink-soft);}
  .badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;}

  button.btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--white);
    padding:9px 16px;
    border-radius:9px;
    cursor:pointer;
    transition:transform .12s ease, opacity .15s ease, box-shadow .15s ease;
  }
  button.btn:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 4px 12px rgba(28,43,57,.18);}
  button.btn:active{transform:translateY(1px);box-shadow:none;}
  button.btn.ghost{background:transparent;color:var(--ink);border-color:var(--paper-line);}
  button.btn.ghost:hover{border-color:var(--ink);box-shadow:none;}
  button.btn.pine{background:linear-gradient(135deg,var(--pine),var(--pine-dark));border-color:var(--pine);}
  button.btn.danger{background:transparent;color:var(--alert);border-color:var(--alert-tint);}
  button.btn.danger:hover{background:var(--alert-tint);}
  button.btn.small{padding:6px 11px;font-size:12.5px;border-radius:6px;}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}

  input[type=text],input[type=password],textarea,select{
    font-family:var(--font-body);
    font-size:14px;
    padding:9px 11px;
    border:1px solid var(--paper-line);
    border-radius:7px;
    background:var(--white);
    color:var(--ink);
    width:100%;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--pine);outline-offset:1px;}
  label.field-label{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:block;
    margin:0 0 5px;
  }
  .field{margin-bottom:14px;}

  .card{
    background:var(--paper-card);
    border:1px solid var(--paper-line);
    border-radius:14px;
    box-shadow:var(--shadow);
    transition:box-shadow .18s ease, transform .18s ease;
  }
  .sim-card:hover, .list-row:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
  .materia-grupo h3{
    display:flex;align-items:center;gap:10px;
  }
  .materia-grupo h3::before{
    content:"";width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--pine));
    flex:none;
  }

  .name-gate{
    max-width:420px;
    margin:40px auto;
    padding:26px;
    text-align:center;
  }
  .name-gate h2{font-family:var(--font-display);font-size:22px;margin:0 0 6px;}
  .grid-simulados{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:16px;
  }
  .sim-card{
    padding:18px;
    position:relative;
    border-style:dashed;
  }
  .sim-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
  .sim-card h3{font-family:var(--font-display);font-size:18px;margin:0 0 6px;font-weight:600;}
  .sim-card p{font-size:13.5px;color:var(--ink-soft);margin:0 0 14px;min-height:20px;}
  .sim-card .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin-bottom:12px;}
  .empty-state{
    padding:36px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-family:var(--font-mono);
    font-size:13px;
    border:1px dashed var(--paper-line);
    border-radius:var(--radius);
  }

  .quiz-header{margin-bottom:18px;}
  .quiz-header .eyebrow{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--pine);}
  .progress-bar{height:6px;border-radius:100px;background:var(--paper-line);overflow:hidden;margin-top:10px;}
  .progress-bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--pine),var(--ochre));}
  .question-card{padding:20px;margin-bottom:14px;position:relative;transition:box-shadow .15s ease;}
  .question-card.marcada{
    border-left:5px solid var(--alert);
    background:linear-gradient(90deg, var(--alert-tint) 0%, var(--paper-card) 42px);
    box-shadow:var(--shadow-lg);
  }
  .btn-marcar{font-family:var(--font-mono);letter-spacing:.02em;}
  .question-card .qnum{font-family:var(--font-mono);font-size:11px;color:var(--pine);margin-bottom:6px;}
  .question-card p.enunciado{font-size:16px;font-weight:600;margin:0 0 14px;}
  .opcao{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;
    border:1px solid var(--paper-line);
    border-radius:8px;
    margin-bottom:8px;
    cursor:pointer;
    background:var(--white);
    font-size:14px;
  }
  .opcao:hover{border-color:var(--pine);}
  .opcao.selected{border-color:var(--pine);background:var(--pine-tint);font-weight:600;}
  .opcao input{accent-color:var(--pine);}
  .opcao.correta{border-color:var(--pine);background:var(--pine-tint);}
  .opcao.errada{border-color:var(--alert);background:var(--alert-tint);}
  .quiz-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}

  .result-hero{
    padding:28px;
    text-align:center;
    margin-bottom:20px;
  }
  .result-hero .score{
    font-family:var(--font-display);
    font-size:56px;
    font-weight:700;
    color:var(--pine-dark);
    line-height:1;
  }
  .result-hero .score small{font-size:22px;color:var(--ink-soft);font-weight:500;}
  .review-item{padding:16px 18px;margin-bottom:10px;}
  .review-item .tag-descritor{
    font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--water);background:var(--water-tint);padding:2px 8px;border-radius:100px;display:inline-block;margin-bottom:8px;
  }

  .login-gate{max-width:380px;margin:50px auto;padding:28px;text-align:center;}
  .login-gate h2{font-family:var(--font-display);margin:0 0 4px;font-size:22px;}

  .subtabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .subtabs button{
    font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;
    background:var(--white);border:1px solid var(--paper-line);border-radius:100px;
    padding:7px 14px;cursor:pointer;color:var(--ink-soft);
  }
  .subtabs button.active{background:var(--ink);color:var(--white);border-color:var(--ink);}

  table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.data-table th{
    text-align:left;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-soft);border-bottom:1px solid var(--paper-line);padding:8px 10px;
  }
  table.data-table td{padding:10px;border-bottom:1px solid var(--paper-line);vertical-align:top;}
  table.data-table tr:last-child td{border-bottom:none;}

  .switch{position:relative;display:inline-block;width:38px;height:22px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;cursor:pointer;inset:0;background:#C9C4AE;border-radius:100px;transition:.15s;}
  .switch .slider::before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:white;border-radius:50%;transition:.15s;}
  .switch input:checked + .slider{background:var(--pine);}
  .switch input:checked + .slider::before{transform:translateX(16px);}

  .list-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 16px;border-bottom:1px solid var(--paper-line);
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .info h4{margin:0 0 3px;font-family:var(--font-display);font-size:15.5px;font-weight:600;}
  .list-row .info p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .row-actions{display:flex;align-items:center;gap:8px;flex:none;}

  form.panel-form{padding:18px;margin-bottom:22px;}
  form.panel-form .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:600px){form.panel-form .grid-2{grid-template-columns:1fr;}}

  .opcao-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .opcao-row input[type=radio]{accent-color:var(--pine);flex:none;}
  .opcao-row input[type=text]{flex:1;}
  .opcao-row .letra{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);width:16px;}

  .foto-preview-wrap{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-top:4px;}
  .foto-preview{max-width:220px;max-height:150px;border-radius:8px;border:1px solid var(--paper-line);display:block;object-fit:cover;}
  input[type=file]{
    font-family:var(--font-body);font-size:13px;padding:8px;border:1px dashed var(--paper-line);
    border-radius:7px;background:var(--white);width:100%;cursor:pointer;
  }
  .question-photo{margin-bottom:14px;}
  .question-photo img{max-width:100%;max-height:320px;border-radius:8px;display:block;border:1px solid var(--paper-line);object-fit:contain;background:var(--white);cursor:zoom-in;transition:box-shadow .15s ease, transform .15s ease;}
  .question-photo img:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
  .review-item .question-photo img{max-height:220px;}

  .fx-lightbox{position:fixed;inset:0;background:rgba(28,43,57,.82);display:flex;align-items:center;justify-content:center;padding:24px;z-index:9999;cursor:zoom-out;animation:fxFadeIn .15s ease;}
  .fx-lightbox img{max-width:min(94vw,1100px);max-height:92vh;border-radius:10px;box-shadow:var(--shadow-lg);object-fit:contain;background:var(--white);cursor:default;}
  .fx-lightbox .fx-lightbox-close{position:absolute;top:18px;right:22px;width:40px;height:40px;border-radius:50%;border:none;background:var(--paper-card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer;box-shadow:var(--shadow);}
  .fx-lightbox .fx-lightbox-close:hover{background:var(--white);}
  @keyframes fxFadeIn{from{opacity:0}to{opacity:1}}

  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{padding:16px;}
  .stat-card .num{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--pine-dark);}
  .stat-card .lbl{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.05em;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-row .label{width:150px;flex:none;font-size:13px;font-weight:600;}
  .bar-track{flex:1;height:10px;background:var(--paper-line);border-radius:100px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--alert);}
  .bar-row .pct{width:44px;flex:none;text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);}

  .chart-bars{display:flex;align-items:flex-end;gap:16px;height:230px;padding:10px 6px 0;overflow-x:auto;}
  .chart-bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:54px;flex:none;height:100%;}
  .chart-bar-value{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin-bottom:6px;white-space:nowrap;}
  .chart-bar-track{width:30px;height:100%;background:var(--paper-line);border-radius:6px 6px 0 0;display:flex;align-items:flex-end;overflow:hidden;}
  .chart-bar-fill{width:100%;border-radius:6px 6px 0 0;background:var(--pine);transition:height .25s ease;}
  .chart-bar-label{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);margin-top:8px;max-width:72px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .rank-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--paper-line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-pos{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--pine-dark);width:30px;flex:none;text-align:center;}
  .rank-info{flex:1;min-width:0;}
  .rank-label{font-size:13px;font-weight:600;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rank-value{width:48px;flex:none;text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);}

  @media print{
    header.site, nav.tabs, .subtabs, .no-print{display:none !important;}
    body{background:#fff;}
    main#app{padding:0;max-width:100%;}
    .card{box-shadow:none;border:1px solid #ccc;}
  }

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--white);padding:11px 20px;border-radius:8px;
    font-size:13.5px;box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .config-warning{
    background:var(--ochre-tint);border:1px solid #E3C089;color:#7A5323;
    padding:14px 16px;border-radius:8px;font-size:13px;margin-bottom:20px;font-family:var(--font-mono);
  }

  ::selection{background:var(--pine-tint);}

  body.dark{
    --ink:#F1F4F2; --ink-soft:#AEB9B5; --paper:#0E1110; --paper-card:#171C1A;
    --paper-line:#2B3531; --pine:#67B59D; --pine-dark:#8FD1BB; --pine-tint:#19352D;
    --ochre:#D9A65E; --ochre-tint:#3A2C1B; --water:#7FB3CF; --water-tint:#1D303A;
    --alert:#E47D7D; --alert-tint:#3A2020; --white:#111514;
    --shadow:0 8px 28px rgba(0,0,0,.28);
    background-image:radial-gradient(circle at 10% 0%, rgba(103,181,157,.07), transparent 32%),radial-gradient(circle at 100% 10%, rgba(217,166,94,.05), transparent 30%);
  }
  body.dark .brand h1, body.dark .section-head h2, body.dark .name-gate h2{color:var(--ink);}
  body.dark input[type=text], body.dark input[type=password], body.dark textarea, body.dark select, body.dark .opcao{
    background:#101413;color:var(--ink);border-color:var(--paper-line);
  }
  body.dark button.btn.ghost{color:var(--ink);}
  body.dark .badge.off{background:#252B29;color:#AEB9B5;}
  body.dark .toast{background:#F1F4F2;color:#111514;}
  body.dark .config-warning{background:#3A2C1B;color:#F0D5A8;border-color:#6D512C;}
  body.dark ::selection{background:#245344;}
  .theme-toggle{
    margin-left:auto; display:inline-flex; align-items:center; gap:8px; padding:8px 12px;
    border:1px solid var(--paper-line); border-radius:8px; background:var(--paper-card); color:var(--ink);
    font:600 12px var(--font-body); cursor:pointer; transition:.15s ease;
  }
  .theme-toggle:hover{transform:translateY(-1px);border-color:var(--pine);}
  .theme-toggle .theme-dot{width:10px;height:10px;border-radius:50%;background:var(--ink);display:block;}
  @media(max-width:620px){.theme-toggle{font-size:11px;padding:7px 9px}.theme-toggle span:last-child{display:none;}}

.toggle-ativo input{width:18px;height:18px;accent-color:#168a63;}
.toggle-ativo{padding:7px 10px;border:1px solid var(--paper-line);border-radius:10px;background:var(--paper-card);}

  .brand h1 span{display:block;font-size:.48em;font-style:italic;font-weight:500;letter-spacing:.02em;margin-top:2px;color:var(--muted);}
  .site-footer{width:min(100%,1180px);margin:36px auto 0;padding:28px 24px 24px;box-sizing:border-box;border-top:1px solid var(--paper-line);display:flex;flex-direction:column;align-items:center;gap:18px;}
  .footer-logos{display:flex;align-items:center;justify-content:center;gap:34px;}
  .footer-logo{width:104px;height:104px;object-fit:contain;display:block;}
  .footer-divider{width:1px;height:64px;background:var(--paper-line);}
  .footer-text{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;}
  .footer-text strong{color:var(--ink);}
  @media(max-width:620px){.site-footer{margin-top:24px;padding:22px 14px}.footer-logos{gap:20px}.footer-logo{width:82px;height:82px}.footer-divider{height:48px}.footer-text{font-size:10px;line-height:1.5;}}
</style>

function esc(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function hashSenha(senha){
  const dados=new TextEncoder().encode(String(senha));
  const buffer=await crypto.subtle.digest('SHA-256',dados);
  return Array.from(new Uint8Array(buffer)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function senhaConfere(senha,hash){
  if(!hash) return false;
  return (await hashSenha(senha))===hash;
}

  return configCarregado;
}

function renderCarregando(){
  app.innerHTML = '<div class="empty-state">Carregando…</div>';
}

function aoAtualizarDados(){
  if (!configCarregado || !senhasProntas){
    renderCarregando();
    return;
  }
  if (perguntasCarregado && resultadosCarregado && limparReferenciasInexistentes()) salvarDados();
  render();
}

function tratarErroFirebase(err){
  
  console.error('Firebase:', err);
}

let migracaoSenhasExecutada=false;
let senhasProntas=false;
async function migrarSenhasLegadas(){
  if(migracaoSenhasExecutada) return;
  migracaoSenhasExecutada=true;
  let mudou=false;
  for(const a of state.alunos){
    if(a.senha && !a.senhaHash){ a.senhaEntrega=a.senha; a.senhaHash=await hashSenha(a.senha); delete a.senha; mudou=true; }
  }
  for(const p of state.professores){
    if(p.senha && !p.senhaHash){ p.senhaHash=await hashSenha(p.senha); delete p.senha; mudou=true; }
  }
  if(mudou) await salvarDados();
  senhasProntas=true;
  if(configCarregado) render();
}

function escutarDados(){
  onSnapshot(configDocRef, snap=>{

    
    if (configSalvando || Date.now() < ignorarSnapshotConfigAte) {
      return;
    }
    const data = snap.exists() ? snap.data() : {};
    state.simulados = Array.isArray(data.simulados) ? data.simulados.map(s=>({...s, conteudo: s.conteudo || 'Geral'})) : [];
    state.alunos = Array.isArray(data.alunos) ? data.alunos : [];
    state.professores = Array.isArray(data.professores) ? data.professores : [];
    state.turmas = Array.isArray(data.turmas) ? data.turmas : [];
    state.alunos.forEach(a=>{
      if (!Array.isArray(a.turmaIds)) a.turmaIds = a.turmaId ? [a.turmaId] : [];
      a.login = String(a.login ?? '').trim();
      a.nome = String(a.nome ?? '').trim();
    });
    state.professores.forEach(p=>{
      p.login = String(p.login ?? '').trim();
      p.nome = String(p.nome ?? '').trim();
      if (p.ativo === undefined) p.ativo = true;
    });
    migrarSenhasLegadas();
    state.turmas.forEach(t=>{
      if (!Array.isArray(t.alunoIds)) t.alunoIds = [];
      if (!Array.isArray(t.simuladoIds)) t.simuladoIds = [];
    });
    configCarregado = true;
    ultimoSnapshotConfigAplicado = Date.now();
    aoAtualizarDados();
  }, tratarErroFirebase);

  onSnapshot(perguntasColRef, snap=>{
    perguntasRemotoIds = new Set(snap.docs.map(d=>d.id));
    state.perguntas = snap.docs.map(d=>d.data());
    perguntasCarregado = true;
    aoAtualizarDados();
  }, tratarErroFirebase);

  onSnapshot(resultadosColRef, snap=>{
    resultadosRemotoIds = new Set(snap.docs.map(d=>d.id));
    state.resultados = snap.docs.map(d=>d.data());
    resultadosCarregado = true;
    aoAtualizarDados();
  }, tratarErroFirebase);
}

function limparReferenciasInexistentes(){
  let mudou=false;
  const alunoIds=new Set(state.alunos.map(a=>a.id));
  const simIds=new Set(state.simulados.map(s=>s.id));
  state.turmas.forEach(t=>{
    const alunos=Array.isArray(t.alunoIds)?t.alunoIds:[];
    const simulados=Array.isArray(t.simuladoIds)?t.simuladoIds:[];
    const novosAlunos=alunos.filter(id=>alunoIds.has(id));
    const novosSimulados=simulados.filter(id=>simIds.has(id));
    if(novosAlunos.length!==alunos.length||novosSimulados.length!==simulados.length)mudou=true;
    t.alunoIds=novosAlunos;
    t.simuladoIds=novosSimulados;
  });
  state.alunos.forEach(a=>{
    if(!Array.isArray(a.turmaIds))a.turmaIds=[];
    const novas=a.turmaIds.filter(id=>state.turmas.some(t=>t.id===id));
    if(novas.length!==a.turmaIds.length)mudou=true;
    a.turmaIds=novas;
  });
  return mudou;
}

async function salvarDados(){
  salvarEstadoLocal();
  configSalvarNovamente=true;
  if(configSalvando)return;
  configSalvando=true;
  while(configSalvarNovamente){
    configSalvarNovamente=false;
    const configAtual={
      simulados:state.simulados.map(x=>({...x})),
      alunos:state.alunos.map(x=>{const y={...x};delete y.senha;return y;}),
      professores:state.professores.map(x=>{const y={...x};delete y.senha;return y;}),
      turmas:state.turmas.map(x=>({...x,alunoIds:[...(x.alunoIds||[])],simuladoIds:[...(x.simuladoIds||[])]}))
    };
    const escritas=[];
    const configJson=JSON.stringify(configAtual);
    try{
      if(configJson!==ultimaConfiguracaoGravada){
        await setDoc(configDocRef,configAtual);
        ultimaConfiguracaoGravada=configJson;
      }
      const idsLocaisPerguntas=new Set();
      for(const p of state.perguntas){
        if(!p?.id)continue;
        idsLocaisPerguntas.add(p.id);
        const json=JSON.stringify(p);
        if(perguntasGravadas.get(p.id)!==json){
          escritas.push(setDoc(doc(perguntasColRef,p.id),p));
          perguntasGravadas.set(p.id,json);
        }
      }
      for(const id of perguntasRemotoIds){
        if(!idsLocaisPerguntas.has(id)){
          escritas.push(deleteDoc(doc(perguntasColRef,id)));
          perguntasGravadas.delete(id);
        }
      }
      const idsLocaisResultados=new Set();
      for(const r of state.resultados){
        if(!r?.id)continue;
        idsLocaisResultados.add(r.id);
        const json=JSON.stringify(r);
        if(resultadosGravados.get(r.id)!==json){
          escritas.push(setDoc(doc(resultadosColRef,r.id),r));
          resultadosGravados.set(r.id,json);
        }
      }
      for(const id of resultadosRemotoIds){
        if(!idsLocaisResultados.has(id)){
          escritas.push(deleteDoc(doc(resultadosColRef,id)));
          resultadosGravados.delete(id);
        }
      }
      if(escritas.length)await Promise.all(escritas);
    }catch(err){
      console.error('Firebase: falha ao salvar',err);
      configSalvarNovamente=true;
      await new Promise(r=>setTimeout(r,1200));
    }
  }
  configSalvando=false;
  ignorarSnapshotConfigAte=Date.now()+1200;
  salvarEstadoLocal();
}

function comprimirImagem(file, maxLado=900, qualidade=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler imagem'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Falha ao processar imagem'));
      img.onload = () => {
        let {width, height} = img;
        if (width > maxLado || height > maxLado){
          const escala = maxLado / Math.max(width, height);
          width = Math.round(width * escala);
          height = Math.round(height * escala);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function fotosDaPergunta(pergunta){
  if(!pergunta)return [];
  if(Array.isArray(pergunta.fotos))return pergunta.fotos.filter(Boolean);
  return pergunta.foto?[pergunta.foto]:[];
}

function perguntasDoSimulado(simuladoId){
  return state.perguntas.filter(p=>p.simuladoId === simuladoId);
}

function restaurarScrollSeNecessario(){
  if (!scrollRestaurarPendente) return;
  const y = Number(localStorage.getItem('estadoSiteScroll') || 0);
  scrollRestaurarPendente = false;
  requestAnimationFrame(()=>window.scrollTo(0, Math.max(0, y)));
}

function render(){
  salvarEstadoLocal();
  app.innerHTML = '';

  
  if (state.view === 'aluno') {
    if (state.quizSimuladoId && state.alunoAuthed) {
      renderQuiz();
    } else if (state.quizResultado && state.alunoAuthed) {
      renderQuizResultado();
    } else {
      renderAluno();
    }
    restaurarScrollSeNecessario();
    return;
  }

  renderProfessor();
  restaurarScrollSeNecessario();
}

function tentativasDoAluno(alunoId, simuladoId){
  return state.resultados.filter(r=>r.alunoId===alunoId && r.simuladoId===simuladoId).length;
}
function simuladoPodeSerIniciado(simulado, aluno){
  if (!simulado || !aluno) return {ok:false, motivo:'Simulado indisponível.'};
  if (simulado.ativo === false) return {ok:false, motivo:'Este simulado não está disponível.'};
  const agora=Date.now();
  if (simulado.abertura && agora < simulado.abertura) return {ok:false, motivo:'Abertura: '+new Date(simulado.abertura).toLocaleString('pt-BR')};
  if (simulado.encerramento && agora > simulado.encerramento) return {ok:false, motivo:'Este simulado já foi encerrado.'};
  if (simulado.maxTentativas && tentativasDoAluno(aluno.id,simulado.id) >= simulado.maxTentativas) return {ok:false, motivo:'Você já atingiu o limite de tentativas.'};
  if (!perguntasDoSimulado(simulado.id).length) return {ok:false, motivo:'Este simulado ainda não possui perguntas.'};
  return {ok:true};
}
function embaralhar(arr){
  const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;
}
function formatarTempo(ms){ const total=Math.max(0,Math.ceil(ms/1000)); const m=Math.floor(total/60), s=total%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }

let quizTimerId = null;

function turmasDoAluno(alunoId){
  return state.turmas.filter(t=>Array.isArray(t.alunoIds) && t.alunoIds.includes(alunoId));
}

function simuladosDisponiveisParaAluno(aluno){
  const turmas = turmasDoAluno(aluno.id);
  
  if (!turmas.length) return state.simulados.filter(s=>s.ativo !== false);
  const ids = new Set();
  turmas.forEach(t=>(t.simuladoIds||[]).forEach(id=>ids.add(id)));

  
  return state.simulados.filter(s=>ids.has(s.id) && s.ativo !== false);
}

function renderAluno(){
  if (!state.alunoAuthed){
    app.innerHTML = `
      <div class="card login-gate">
        <h2>Área do aluno</h2>
        <p class="muted" style="font-size:13.5px;">Acesse seus simulados.</p>
        <form id="form-login-aluno" style="margin-top:16px;">
          <div class="field" style="text-align:left;">
            <label class="field-label">Login</label>
            <input type="text" id="input-login-aluno" placeholder="Ex.: maria.silva" required autofocus />
          </div>
          <div class="field" style="text-align:left;">
            <label class="field-label">Senha</label>
            <input type="password" id="input-senha-aluno" required />
          </div>
          <button class="btn pine" type="submit" style="width:100%;">Entrar</button>
        </form>
      </div>`;
    document.getElementById('form-login-aluno').addEventListener('submit', async e=>{
      e.preventDefault();
      const login = document.getElementById('input-login-aluno').value.trim().toLowerCase();
      const senha = document.getElementById('input-senha-aluno').value;
      const aluno = state.alunos.find(a=>String(a.login ?? '').trim().toLowerCase()===login);
      if (!aluno || aluno.ativo===false || !(await senhaConfere(senha,aluno.senhaHash))){ toast('Login ou senha incorretos.'); return; }
      if (!Array.isArray(aluno.turmaIds)) aluno.turmaIds = aluno.turmaId ? [aluno.turmaId] : [];
      state.alunoAuthed = {id:aluno.id, nome:aluno.nome, login:aluno.login};
      state.quizSimuladoId = null;
      state.quizRespostas = {};
      state.quizResultado = null;
      state.quizPerguntaIds=[]; state.quizFimEm=null; state.quizIniciadoEm=null; state.quizOrdemOpcoes={};
      render();
    });
    return;
  }

  const alunoAtual = state.alunos.find(a=>a.id===state.alunoAuthed.id) || state.alunoAuthed;
  const turmasAluno = turmasDoAluno(alunoAtual.id);
  const ativos = simuladosDisponiveisParaAluno(alunoAtual);
  const nomesTurmas = turmasAluno.map(t=>t.nome).join(', ');

  
  const materias = [...new Set(ativos.map(s=>s.conteudo || 'Geral'))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  if (state.alunoFiltroConteudo !== 'todas' && !materias.includes(state.alunoFiltroConteudo)) {
    state.alunoFiltroConteudo = 'todas';
  }
  const filtro = state.alunoFiltroConteudo;

  function cardSimulado(s){
    return `
      <div class="card sim-card">
        <div class="top-row">
          <h3>${esc(s.titulo)}</h3>
          <span class="badge on dot">Liberado</span>
        </div>
        <p>${esc(s.descricao || 'Simulado.')}</p>
        <div class="meta">${perguntasDoSimulado(s.id).length} pergunta(s) · ${s.tempoMin?s.tempoMin+' min':'sem limite'} · ${s.maxTentativas?Math.max(0,s.maxTentativas-tentativasDoAluno(alunoAtual.id,s.id))+' tentativa(s) restante(s)':'tentativas ilimitadas'}</div>
        ${(()=>{const disp=simuladoPodeSerIniciado(s,alunoAtual); return `<button class="btn pine" data-action="iniciar-quiz" data-id="${s.id}" ${disp.ok?'':'disabled'}>${disp.ok?'Fazer simulado':esc(disp.motivo)}</button>`})()}
      </div>`;
  }

  let listaHtml;
  if (ativos.length === 0){
    listaHtml = `<div class="empty-state">Nenhum simulado foi liberado para sua turma no momento. Volte mais tarde.</div>`;
  } else if (filtro === 'todas'){

    listaHtml = materias.map(materia => `
      <div class="materia-grupo" style="margin-bottom:22px;">
        <h3 style="font-family:var(--font-display);font-size:16px;margin:0 0 10px;">${esc(materia)}</h3>
        <div class="grid-simulados">
          ${ativos.filter(s=>(s.conteudo||'Geral')===materia).map(cardSimulado).join('')}
        </div>
      </div>`).join('');
  } else {
    const daMateria = ativos.filter(s=>(s.conteudo||'Geral')===filtro);
    listaHtml = daMateria.length ? `<div class="grid-simulados">${daMateria.map(cardSimulado).join('')}</div>` : `<div class="empty-state">Nenhum simulado liberado em "${esc(filtro)}" no momento.</div>`;
  }

  app.innerHTML = `
    <div class="section-head">
      <div>
        <h2>Simulados disponíveis</h2>
        ${nomesTurmas ? `<p class="muted" style="margin:4px 0 0;font-size:13px;">Turma(s): <strong>${esc(nomesTurmas)}</strong></p>` : ''}
      </div>
      <span class="muted" style="font-size:13px;">Olá, <strong>${esc(alunoAtual.nome)}</strong> · <a href="#" id="abrir-senha-aluno" style="text-decoration:underline;">Alterar senha</a> · <a href="#" id="sair-aluno" style="text-decoration:underline;">sair</a></span>
    </div>
    ${materias.length > 1 ? `
    <div class="subtabs" style="margin-bottom:18px;">
      <button type="button" data-materia="todas" class="${filtro==='todas'?'active':''}">Todas as matérias</button>
      ${materias.map(m=>`<button type="button" data-materia="${esc(m)}" class="${filtro===m?'active':''}">${esc(m)}</button>`).join('')}
    </div>` : ''}
    ${listaHtml}
  `;

  app.querySelectorAll('[data-materia]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.alunoFiltroConteudo = btn.dataset.materia;
      salvarEstadoLocal();
      render();
    });
  });

  document.getElementById('abrir-senha-aluno').addEventListener('click', async e=>{
    e.preventDefault();
    const nova = prompt('Digite a nova senha:');
    if (nova === null) return;
    if (nova.length < 4){ toast('A nova senha deve ter pelo menos 4 caracteres.'); return; }
    const confirma = prompt('Digite novamente a nova senha:');
    if (nova !== confirma){ toast('As senhas não conferem.'); return; }
    const aluno = state.alunos.find(a=>a.id===state.alunoAuthed.id);
    if (!aluno) return;
    aluno.senhaHash = await hashSenha(nova);
    delete aluno.senha;
    await salvarDados();
    toast('Senha alterada com sucesso.');
  });

  document.getElementById('sair-aluno').addEventListener('click', e=>{
    e.preventDefault();
    state.alunoAuthed = null;
    state.quizSimuladoId = null;
    state.quizRespostas = {};
    state.quizResultado = null;
    state.quizPerguntaIds=[]; state.quizFimEm=null; state.quizIniciadoEm=null; state.quizOrdemOpcoes={};
    render();
  });
  app.querySelectorAll('[data-action="iniciar-quiz"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sim=state.simulados.find(x=>x.id===btn.dataset.id);
      const aluno=state.alunoAuthed;
      const pode=simuladoPodeSerIniciado(sim,aluno);
      if(!pode.ok){ toast(pode.motivo); return; }
      state.quizSimuladoId = btn.dataset.id;
      state.quizRespostas = {};
      let ids=perguntasDoSimulado(sim.id).map(p=>p.id);
      if(sim.aleatorio!==false) ids=embaralhar(ids);
      state.quizPerguntaIds=ids;
      state.quizOrdemOpcoes={};
      state.quizIniciadoEm=Date.now();
      state.quizFimEm=sim.tempoMin ? Date.now()+sim.tempoMin*60000 : null;
      salvarEstadoLocal();
      render();
    });
  });
}

function renderQuiz(){
  if (quizTimerId) { clearInterval(quizTimerId); quizTimerId = null; }
  const simulado = state.simulados.find(s=>s.id===state.quizSimuladoId);
  let perguntas = perguntasDoSimulado(state.quizSimuladoId);
  if (state.quizPerguntaIds.length){
    const mapa=new Map(perguntas.map(p=>[p.id,p]));
    perguntas=state.quizPerguntaIds.map(id=>mapa.get(id)).filter(Boolean);
  }
  if (!simulado){ state.quizSimuladoId = null; render(); return; }

  const respondidas = Object.keys(state.quizRespostas).length;
  const pct = perguntas.length ? Math.round((respondidas/perguntas.length)*100) : 0;

  app.innerHTML = `
    <div class="quiz-header">
      <p class="eyebrow">${esc(simulado.titulo)}</p>
      <div class="progress-bar"><span style="width:${pct}%"></span></div>
      <p class="muted" style="font-size:12.5px;margin:6px 0 0;">${respondidas} de ${perguntas.length} respondidas</p>
      ${simulado.tempoMin ? `<p id="quiz-timer" style="font-weight:700;margin:8px 0 0;">Tempo restante: ${formatarTempo((state.quizFimEm||Date.now())-Date.now())}</p>` : ''}
    </div>
    <div id="quiz-questions"></div>
    <div class="quiz-footer">
      <button class="btn ghost" id="btn-sair-quiz">Sair sem salvar</button>
      <button class="btn pine" id="btn-enviar-quiz" ${respondidas<perguntas.length?'disabled':''}>Enviar respostas</button>
    </div>
  `;

  const qWrap = document.getElementById('quiz-questions');
  qWrap.innerHTML = perguntas.map((p,i)=>`
    <div class="card question-card">
      <p class="qnum">Questão ${i+1} de ${perguntas.length}</p>
      <p class="enunciado">${esc(p.enunciado)}</p>
      ${fotosDaPergunta(p).map((foto,j)=>`<div class="question-photo"><img src="${foto}" alt="Imagem ${j+1} da questão ${i+1}" /></div>`).join('')}
      ${(()=>{
        const ordem = state.quizOrdemOpcoes[p.id] || (simulado.aleatorio!==false ? embaralhar((p.opcoes||[]).map((_,i)=>i)) : (p.opcoes||[]).map((_,i)=>i));
        state.quizOrdemOpcoes[p.id]=ordem;
        return ordem.map(idx=>{const op=p.opcoes[idx]; return `<label class="opcao ${state.quizRespostas[p.id]===idx?'selected':''}" data-pergunta="${p.id}" data-idx="${idx}"><input type="radio" name="q-${p.id}" ${state.quizRespostas[p.id]===idx?'checked':''} /><span>${esc(op)}</span></label>`}).join('');
      })()}
    </div>
  `).join('');

  if (quizTimerId) { clearInterval(quizTimerId); quizTimerId=null; }
  const atualizarTimer=()=>{
    if(!simulado.tempoMin || !state.quizFimEm) return;
    const restante=state.quizFimEm-Date.now();
    const timer=document.getElementById('quiz-timer');
    if(timer) timer.textContent='Tempo restante: '+formatarTempo(restante);
    if(restante<=0){ clearInterval(quizTimerId); quizTimerId=null; finalizarQuiz(true); }
  };
  if(simulado.tempoMin){ atualizarTimer(); quizTimerId=setInterval(atualizarTimer,1000); }

  qWrap.querySelectorAll('.opcao').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.quizRespostas[el.dataset.pergunta] = Number(el.dataset.idx);
      salvarEstadoLocal();
      renderQuiz();
    });
  });

  document.getElementById('btn-sair-quiz').addEventListener('click', ()=>{
    state.quizSimuladoId = null;
    state.quizRespostas = {};
    state.quizPerguntaIds=[]; state.quizFimEm=null; state.quizIniciadoEm=null;
    salvarEstadoLocal(); render();
  });

  async function finalizarQuiz(forced=false){
    if(quizTimerId) { clearInterval(quizTimerId); quizTimerId=null; }
    const detalhes = perguntas.map(p=>{
      const respostaAluno = state.quizRespostas[p.id];
      const acertou = respostaAluno === p.respostaCorreta;
      return {
        perguntaId: p.id,
        enunciado: p.enunciado,
        opcoes: p.opcoes || [],
        descritor: p.descritor || '',
        foto: p.foto || '',
        respostaAluno,
        respostaCorreta: p.respostaCorreta,
        acertou
      };
    });
    const acertos = detalhes.filter(d=>d.acertou).length;
    const resultado = {
      id: uid(),
      simuladoId: simulado.id,
      simuladoTitulo: simulado.titulo,
      alunoId: state.alunoAuthed.id,
      alunoNome: state.alunoAuthed.nome,
      alunoLogin: state.alunoAuthed.login,
      data: Date.now(),
      acertos,
      total: perguntas.length,
      nota: perguntas.length ? Number((acertos/perguntas.length*10).toFixed(1)) : 0,
      detalhes
    };
    state.resultados.unshift(resultado);
    salvarDados();
    state.quizResultado = resultado;

function baixarArquivo(nome, conteudo, tipo='text/plain;charset=utf-8'){
  const blob = new Blob([conteudo], {type: tipo});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function csvEsc(v){
  return '"' + String(v ?? '').replace(/"/g,'""') + '"';
}

function alunosFiltradosPorTurma(filtro='todas') {
  if (filtro === 'todas') return state.alunos;
  return state.alunos.filter(a=>turmasDoAluno(a.id).some(t=>t.id===filtro));
}

function resultadosFiltradosPorTurma(filtro='todas') {

  
  const simIds = simuladoIdsVisiveis();
  let base = state.resultados.filter(r=>simIds.has(r.simuladoId));
  if (filtro === 'todas') return base;
  const ids = new Set(alunosFiltradosPorTurma(filtro).map(a=>a.id));
  return base.filter(r=>ids.has(r.alunoId));
}

function resultadosDoRelatorioAtual() {

  const simuladosAtuais = new Map(state.simulados.map(s=>[s.id,s]));
  const perguntasAtuais = new Map(state.perguntas.map(p=>[p.id,p]));
  return resultadosFiltradosPorTurma(state.relatorioTurmaId)
    .filter(r=>simuladosAtuais.has(r.simuladoId))
    .map(r=>{
      const detalhes = (r.detalhes||[])
        .filter(d=>perguntasAtuais.has(d.perguntaId))
        .map(d=>{
          const p=perguntasAtuais.get(d.perguntaId);
          return {...d, enunciado:p.enunciado, descritor:p.descritor||d.descritor,
            opcoes:Array.isArray(p.opcoes)?p.opcoes:d.opcoes, fotos:fotosDaPergunta(p).length?fotosDaPergunta(p):fotosDaPergunta(d), foto:p.foto||d.foto};
        });
      const acertos = detalhes.filter(d=>d.acertou).length;
      const total = detalhes.length;
      const simAtual = simuladosAtuais.get(r.simuladoId);
      if (!simAtual) return null;
      return {...r, simuladoTitulo:simAtual.titulo, detalhes, acertos, total,
        nota: total ? Number((acertos/total*10).toFixed(1)) : 0};
    }).filter(Boolean);
}

    state.turmas.forEach(t=>{

      if(deveEstar && !esta) t.alunoIds.push(aluno.id);
      else if(!deveEstar && esta) t.alunoIds = t.alunoIds.filter(id=>id!==aluno.id);

  content.querySelectorAll('[data-action="resetar-senha"]').forEach(el=>el.addEventListener('click',async ()=>{const a=state.alunos.find(x=>x.id===el.dataset.id);if(!a)return;if(!confirm(`Redefinir a senha de ${a.nome} para "${SENHA_PADRAO_ALUNO}"?`))return;a.senhaEntrega=SENHA_PADRAO_ALUNO;a.senhaHash=await hashSenha(SENHA_PADRAO_ALUNO);delete a.senha;salvarDados();toast('Senha redefinida.');render();}));
  content.querySelectorAll('[data-action="del-aluno"]').forEach(el=>el.addEventListener('click',async ()=>{
    const a=state.alunos.find(x=>x.id===el.dataset.id);
    if(!confirm(`Excluir ${a?a.nome:'este aluno'}? Os resultados desse aluno também serão removidos.`))return;
    const alunoArquivar=state.alunos.find(x=>x.id===el.dataset.id);
    if(alunoArquivar){ alunoArquivar.ativo=false; alunoArquivar.arquivadoEm=Date.now(); }
    state.turmas.forEach(t=>t.alunoIds=(t.alunoIds||[]).filter(id=>id!==el.dataset.id));
    if(state.alunoAuthed?.id===el.dataset.id){ state.alunoAuthed=null; state.quizSimuladoId=null; state.quizResultado=null; state.quizRespostas={}; }
    toast('Aluno arquivado.');
    render();
    salvarDados();
  }));
}

              <p class="muted" style="font-size:12.5px;margin-top:-8px;margin-bottom:10px;">${nesta.length} aluno(s) nesta turma.</p>
              <div style="display:grid;gap:10px;">
                ${nesta.length ? nesta.map(linha).join('') : '<p class="muted" style="margin:0;">Nenhum aluno nesta turma ainda.</p>'}
              </div>
              ${outros.length ? `
                <div class="section-head" style="margin-top:18px;margin-bottom:6px;"><h2 style="font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);">Outros alunos (marque para adicionar)</h2></div>
                <div style="display:grid;gap:10px;">${outros.map(linha).join('')}</div>
              ` : ''}
            `;
          })()}
        </div>

        <div class="card">
          <div class="section-head"><h2 style="font-size:17px;">Simulados liberados</h2></div>
          ${simuladosVisiveis().length===0 ? `<p class="muted">Cadastre simulados primeiro na aba "Simulados".</p>` : `
            <p class="muted" style="font-size:12.5px;margin-top:-8px;margin-bottom:14px;">Marque os simulados que esta turma poderá fazer. A liberação é exclusiva desta turma.</p>
            <div style="display:grid;gap:10px;">
              ${simuladosVisiveis().map(s=>{
                const checked = (turma?.simuladoIds||[]).includes(s.id);
                const qtd = perguntasDoSimulado(s.id).length;
                return `<label style="display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--paper-line);border-radius:10px;cursor:pointer;">
                  <input type="checkbox" data-action="toggle-simulado-turma" data-id="${s.id}" ${checked?'checked':''} />
                  <span><strong>${esc(s.titulo)}</strong><small class="muted" style="display:block;">${esc(s.conteudo||'Geral')} · ${qtd} pergunta(s)</small></span>
                </label>`;
              }).join('')}
            </div>`}
        </div>
      </div>

      <div class="card" style="margin-top:18px;">
        <div class="section-head"><h2 style="font-size:17px;">Resumo da turma</h2>
          <button class="btn danger small" id="btn-excluir-turma">Excluir turma</button>
        </div>
        <p class="muted" style="margin:0;">${esc(turma?.nome||'')} · ${(turma?.alunoIds||[]).length} aluno(s) · ${(turma?.simuladoIds||[]).length} simulado(s) liberado(s)</p>
      </div>
    `}
  `;

  document.getElementById('form-nova-turma').addEventListener('submit', e=>{
    e.preventDefault();
    const nome = document.getElementById('turma-nome').value.trim();
    if (!nome) return;
    const turma = {id:uid(), nome, alunoIds:[], simuladoIds:[], criadoEm:Date.now()};
    state.turmas.unshift(turma);
    state.turmaSelecionadaId = turma.id;
    salvarDados();
    toast('Turma criada.');
    e.target.reset();
    render();
  });

  const select = document.getElementById('select-turma-gerenciar');
  if (select) select.addEventListener('change', ()=>{ state.turmaSelecionadaId = select.value; render(); });

  const editarTurma = document.getElementById('form-editar-turma');
  if (editarTurma) editarTurma.addEventListener('submit', e=>{
    e.preventDefault();
    const t = state.turmas.find(x=>x.id===state.turmaSelecionadaId);
    const nome = document.getElementById('editar-turma-nome').value.trim();
    if (!t || !nome) return;
    const repetida = state.turmas.some(x=>x.id!==t.id && x.nome.trim().toLowerCase()===nome.toLowerCase());
    if (repetida){ toast('Já existe uma turma com esse nome.'); return; }
    t.nome = nome;
    salvarDados();
    render();
  });

  content.querySelectorAll('[data-action="toggle-aluno-turma"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const t = state.turmas.find(x=>x.id===state.turmaSelecionadaId);
      const aluno = state.alunos.find(a=>a.id===el.dataset.id);
      if (!t || !aluno) return;
      if (!Array.isArray(t.alunoIds)) t.alunoIds=[];
      if (!Array.isArray(aluno.turmaIds)) aluno.turmaIds=[];
      if (el.checked){
        if (!t.alunoIds.includes(aluno.id)) t.alunoIds.push(aluno.id);
        if (!aluno.turmaIds.includes(t.id)) aluno.turmaIds.push(t.id);
      } else {
        t.alunoIds = t.alunoIds.filter(id=>id!==aluno.id);
        aluno.turmaIds = aluno.turmaIds.filter(id=>id!==t.id);
      }
      salvarDados();
      render();
    });
  });

  content.querySelectorAll('[data-action="toggle-simulado-turma"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const t = state.turmas.find(x=>x.id===state.turmaSelecionadaId);
      if (!t) return;
      if (!Array.isArray(t.simuladoIds)) t.simuladoIds=[];
      if (el.checked){
        if (!t.simuladoIds.includes(el.dataset.id)) t.simuladoIds.push(el.dataset.id);
      } else {
        t.simuladoIds = t.simuladoIds.filter(id=>id!==el.dataset.id);
      }
      salvarDados();
      render();
    });
  });

  const excluir = document.getElementById('btn-excluir-turma');
  if (excluir) excluir.addEventListener('click', ()=>{
    const t = state.turmas.find(x=>x.id===state.turmaSelecionadaId);
    if (!t) return;
    if (!confirm(`Excluir a turma "${t.nome}"? Os alunos continuarão cadastrados, mas deixarão de pertencer a esta turma.`)) return;
    state.alunos.forEach(a=>{ if (Array.isArray(a.turmaIds)) a.turmaIds=a.turmaIds.filter(id=>id!==t.id); });
    state.turmas = state.turmas.filter(x=>x.id!==t.id);
    state.turmaSelecionadaId = state.turmas[0]?.id || null;
    salvarDados();
    toast('Turma excluída.');
    render();
  });
}

function renderTeacherSimulados(content){
  const editando = state.editingSimuladoId ? state.simulados.find(s=>s.id===state.editingSimuladoId) : null;
  content.innerHTML = `
    <form class="card panel-form" id="form-novo-simulado">
      <div class="section-head" style="margin-bottom:14px;"><h2 style="font-size:17px;">${editando?'Editar simulado':'Novo simulado'}</h2></div>
      <div class="grid-2">
        <div class="field"><label class="field-label">Título</label><input type="text" id="ns-titulo" placeholder="Ex.: Simulado — Relevo e Clima" value="${esc(editando?.titulo||'')}" required /></div>
        <div class="field"><label class="field-label">Descrição (opcional)</label><input type="text" id="ns-descricao" placeholder="Breve descrição para o aluno" value="${esc(editando?.descricao||'')}" /></div>
        <div class="field"><label class="field-label">Conteúdo</label><input type="text" id="ns-conteudo" placeholder="Ex.: Clima, Relevo, Cartografia" value="${esc(editando?.conteudo||'')}" required /></div>
        <div class="field"><label class="field-label">Tempo limite (minutos)</label><input type="number" id="ns-tempo" min="0" max="600" value="${editando?.tempoMin||0}" /><small class="muted">0 = sem limite.</small></div>
        <div class="field"><label class="field-label">Máximo de tentativas</label><input type="number" id="ns-tentativas" min="0" max="99" value="${editando ? (editando.maxTentativas??1) : 1}" /><small class="muted">0 = ilimitado.</small></div>
        <div class="field"><label class="field-label">Data de abertura</label><input type="datetime-local" id="ns-abertura" value="${editando?.abertura ? new Date(editando.abertura).toISOString().slice(0,16) : ''}" /></div>
        <div class="field"><label class="field-label">Data de encerramento</label><input type="datetime-local" id="ns-encerramento" value="${editando?.encerramento ? new Date(editando.encerramento).toISOString().slice(0,16) : ''}" /></div>
        <div class="field" style="display:flex;align-items:center;gap:10px;"><input type="checkbox" id="ns-aleatorio" ${editando ? (editando.aleatorio!==false?'checked':'') : 'checked'} /><label for="ns-aleatorio">Embaralhar questões e alternativas</label></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn pine" type="submit">${editando?'Salvar alterações':'Adicionar simulado'}</button>${editando?'<button class="btn ghost" type="button" id="btn-cancelar-edicao-simulado">Cancelar</button>':''}</div>
    </form>

    <div class="card">
      <p class="muted" style="font-size:12.5px;margin:0 0 14px;">Depois de criar um simulado, vá em <strong>Turmas</strong> para escolher quais turmas poderão acessá-lo.</p>
      ${simuladosVisiveis().length === 0 ? `<div class="empty-state">Nenhum simulado cadastrado ainda.</div>` :
        (()=>{
          const meusSimulados = simuladosVisiveis();
          const linhaSimulado = s => `
        <div class="list-row">
          <div class="info">
            <h4>${esc(s.titulo)} <span class="badge ${s.ativo?'on':'off'}" style="margin-left:6px;">${s.ativo?'Ativo':'Inativo'}</span></h4>
            <p>${esc(s.descricao||'—')} · ${perguntasDoSimulado(s.id).length} pergunta(s) · ${s.tempoMin? s.tempoMin+' min':'sem limite'} · ${s.maxTentativas? s.maxTentativas+' tentativa(s)':'tentativas ilimitadas'}</p>
          </div>
          <div class="row-actions">
            <label class="toggle-ativo" style="display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">
              <input type="checkbox" data-action="toggle-ativo" data-id="${s.id}" ${s.ativo?'checked':''} />
              <span>${s.ativo?'Ligado':'Desligado'}</span>
            </label>
            <span class="muted" style="font-size:12px;">Liberação por turma</span>
            <button class="btn ghost small" data-action="editar-simulado" data-id="${s.id}">Editar</button>
            <button class="btn ghost small" data-action="ir-perguntas" data-id="${s.id}">Perguntas</button>
            <button class="btn ghost small" data-action="duplicar-simulado" data-id="${s.id}">Duplicar</button>
            <button class="btn danger small" data-action="del-simulado" data-id="${s.id}">Excluir</button>
          </div>
        </div>`;
          const materiasProf = [...new Set(meusSimulados.map(s=>s.conteudo||'Geral'))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
          return materiasProf.map(materia=>`
            <div class="materia-grupo" style="margin-bottom:24px;">
              <h3 style="font-family:var(--font-display);font-size:16px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--paper-line);">${esc(materia)}
                <span class="badge off" style="margin-left:8px;">${meusSimulados.filter(s=>(s.conteudo||'Geral')===materia).length} simulado(s)</span>
              </h3>
              ${meusSimulados.filter(s=>(s.conteudo||'Geral')===materia).map(linhaSimulado).join('')}
            </div>
          `).join('');
        })()
      }
    </div>
  `;

  document.getElementById('form-novo-simulado').addEventListener('submit', async e=>{
    e.preventDefault();
    const titulo = document.getElementById('ns-titulo').value.trim();
    const descricao = document.getElementById('ns-descricao').value.trim();
    const conteudo = document.getElementById('ns-conteudo').value.trim() || 'Geral';
    const tempoMin = Math.max(0, Number(document.getElementById('ns-tempo').value)||0);
    const maxTentativas = Math.max(0, Number(document.getElementById('ns-tentativas').value)||0);
    const abertura = document.getElementById('ns-abertura').value ? new Date(document.getElementById('ns-abertura').value).getTime() : null;
    const encerramento = document.getElementById('ns-encerramento').value ? new Date(document.getElementById('ns-encerramento').value).getTime() : null;
    const aleatorio = document.getElementById('ns-aleatorio').checked;
    if (!titulo) return;
    if (abertura && encerramento && encerramento <= abertura) { toast('A data de encerramento deve ser depois da abertura.'); return; }
    const foiEdicao = !!state.editingSimuladoId;
    if (foiEdicao){
      const sim = state.simulados.find(s=>s.id===state.editingSimuladoId);
      if (!sim) return;
      Object.assign(sim,{titulo,descricao,conteudo,tempoMin,maxTentativas,abertura,encerramento,aleatorio});
      state.editingSimuladoId=null;
    } else {
      const papel = papelAtual();
      const professorId = (papel==='professor' && state.professorAuthed) ? state.professorAuthed.id : null;
      state.simulados.unshift({id:uid(),titulo,descricao,conteudo,ativo:true,criadoEm:Date.now(),tempoMin,maxTentativas,abertura,encerramento,aleatorio,professorId});
    }
    render();
    try{
      await salvarDados();
      toast(foiEdicao ? 'Simulado atualizado.' : 'Simulado adicionado.');
    }catch(err){
      console.error(err);
      toast('Não foi possível salvar o simulado.');
    }
  });

  const cancelarEdicao = document.getElementById('btn-cancelar-edicao-simulado');
  if (cancelarEdicao) cancelarEdicao.addEventListener('click',()=>{ state.editingSimuladoId=null; render(); });

  content.querySelectorAll('[data-action="editar-simulado"]').forEach(el=>{
    el.addEventListener('click',()=>{
      state.editingSimuladoId=el.dataset.id;
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });

  content.querySelectorAll('[data-action="toggle-ativo"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const sim = state.simulados.find(s=>s.id===el.dataset.id);
      if (!sim) return;
      sim.ativo = el.checked;
      const texto = el.parentElement?.querySelector('span');
      if (texto) texto.textContent = sim.ativo ? 'Ligado' : 'Desligado';
      salvarDados();
      toast(sim.ativo ? 'Simulado ligado.' : 'Simulado desligado.');
      render();
    });
  });
  content.querySelectorAll('[data-action="duplicar-simulado"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const original = state.simulados.find(s=>s.id===el.dataset.id);
      if (!original) return;
      const novoId = uid();
      state.simulados.unshift({
        ...original,
        id: novoId,
        titulo: original.titulo + ' — cópia',
        ativo: false,
        criadoEm: Date.now()
      });
      const perguntasOriginais = perguntasDoSimulado(original.id);
      perguntasOriginais.forEach(p=>{
        state.perguntas.push({...p, id:uid(), simuladoId:novoId});
      });
      state.turmas.forEach(t=>{
        if (Array.isArray(t.simuladoIds) && t.simuladoIds.includes(original.id)) t.simuladoIds.push(novoId);
      });
      salvarDados();
      toast('Simulado duplicado.');
      render();
    });
  });

  content.querySelectorAll('[data-action="ir-perguntas"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.perguntasFiltroSimuladoId = el.dataset.id;
      state.teacherTab = 'perguntas';
      render();
    });
  });
  content.querySelectorAll('[data-action="del-simulado"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id=el.dataset.id;
      const sim=state.simulados.find(s=>s.id===id);
      if (!sim) return;
      if (!confirm(`Arquivar o simulado "${sim.titulo}"? Os resultados e as questões serão preservados.`)) return;
      sim.ativo=false;
      sim.arquivado=true;
      sim.arquivadoEm=Date.now();
      state.turmas.forEach(t=>t.simuladoIds=(t.simuladoIds||[]).filter(x=>x!==id));
      if (state.perguntasFiltroSimuladoId===id) state.perguntasFiltroSimuladoId=simuladosVisiveis()[0]?.id||null;
      salvarDados();
      toast('Simulado arquivado.');
      render();
    });
  });
}

function renderTeacherPerguntas(content){
  const meusSimulados = simuladosVisiveis();
  if ((!state.perguntasFiltroSimuladoId || !meusSimulados.some(s=>s.id===state.perguntasFiltroSimuladoId)) && meusSimulados.length){
    state.perguntasFiltroSimuladoId = meusSimulados[0].id;
  }
  const simuladoAtual = meusSimulados.find(s=>s.id===state.perguntasFiltroSimuladoId);
  const perguntas = state.perguntasFiltroSimuladoId ? perguntasDoSimulado(state.perguntasFiltroSimuladoId) : [];
  const editando = state.editingPerguntaId ? state.perguntas.find(p=>p.id===state.editingPerguntaId) : null;

  content.innerHTML = `
    <div class="field" style="max-width:360px;">
      <label class="field-label">Simulado</label>
      <select id="select-simulado-perguntas">
        ${meusSimulados.length===0?'<option value="">Nenhum simulado cadastrado</option>':''}
        ${meusSimulados.map(s=>`<option value="${s.id}" ${s.id===state.perguntasFiltroSimuladoId?'selected':''}>${esc(s.titulo)}</option>`).join('')}
      </select>
    </div>

    ${state.perguntasFiltroSimuladoId ? `
    <form class="card panel-form" id="form-pergunta">
      <div class="section-head" style="margin-bottom:14px;"><h2 style="font-size:17px;">${editando?'Editar pergunta':'Nova pergunta'}</h2></div>
      <div class="field">
        <label class="field-label">Enunciado</label>
        <textarea id="pg-enunciado" rows="2" required>${esc(editando?.enunciado||'')}</textarea>
      </div>
      <div class="field">
        <label class="field-label">Foto da questão (opcional)</label>
        <div class="foto-preview-wrap" id="pg-fotos-wrap">
          <input type="file" id="pg-foto" accept="image/*" multiple />
          <div id="pg-fotos-preview" style="display:flex;gap:10px;flex-wrap:wrap;width:100%;">
            ${((Array.isArray(state.novaPerguntaFotos)?state.novaPerguntaFotos:[]).length ? state.novaPerguntaFotos : fotosDaPergunta(editando)).map((foto,j)=>`<div data-foto-index="${j}" style="position:relative;"><img class="foto-preview" src="${foto}" alt="Prévia da foto ${j+1}" /><button type="button" class="btn ghost small pg-remover-foto" data-foto-index="${j}" style="margin-top:6px;">Remover</button></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="field">
        <label class="field-label">Alternativas (marque a correta)</label>
        ${[0,1,2,3].map(i=>`
          <div class="opcao-row">
            <span class="letra">${String.fromCharCode(65+i)})</span>
            <input type="radio" name="pg-correta" value="${i}" ${editando ? (editando.respostaCorreta===i?'checked':'') : (i===0?'checked':'')} />
            <input type="text" id="pg-opcao-${i}" placeholder="Alternativa ${String.fromCharCode(65+i)}" value="${esc(editando?.opcoes?.[i]||'')}" required />
          </div>
        `).join('')}
      </div>
      <div class="field" style="max-width:320px;">
        <label class="field-label">Descritor</label>
        <input type="text" id="pg-descritor" placeholder="Ex.: EF07GE05 — Dinâmica climática" value="${esc(editando?.descritor||'')}" />
      </div>
      <div style="display:flex;gap:10px;">
        <button class="btn pine" type="submit">${editando?'Salvar alterações':'Adicionar pergunta'}</button>
        ${editando?'<button class="btn ghost" type="button" id="btn-cancelar-edicao">Cancelar</button>':''}
      </div>
    </form>

    <div class="card">
      ${perguntas.length===0?`<div class="empty-state">Nenhuma pergunta cadastrada para "${esc(simuladoAtual?.titulo||'')}".</div>`:
        perguntas.map((p,i)=>`
        <div class="list-row">
          <div class="info">
            <h4>${i+1}. ${esc(p.enunciado)}</h4>
            <p>${p.descritor?`<span class="badge on" style="margin-right:6px;">${esc(p.descritor)}</span>`:'<span class="muted">Sem descritor</span>'} · resposta correta: ${String.fromCharCode(65+(p.respostaCorreta??0))}</p>
          </div>
          <div class="row-actions">
            <button class="btn ghost small" data-action="edit-pergunta" data-id="${p.id}">Editar</button>
            <button class="btn danger small" data-action="del-pergunta" data-id="${p.id}">Excluir</button>
          </div>
        </div>
      `).join('')}
    </div>
    ` : `<div class="empty-state">Cadastre um simulado primeiro na aba "Simulados".</div>`}
  `;

  const select = document.getElementById('select-simulado-perguntas');
  if (select) select.addEventListener('change', ()=>{
    state.perguntasFiltroSimuladoId = select.value;
    state.editingPerguntaId = null;
    state.novaPerguntaFotos = null;
    render();
  });

  const fotoInput = document.getElementById('pg-foto');
  const fotosPreview = document.getElementById('pg-fotos-preview');
  const fotosAtuais = fotosDaPergunta(editando);
  if (state.novaPerguntaFotos === null) state.novaPerguntaFotos = [...fotosAtuais];
  const atualizarPreviewsFotos = ()=>{
    if(!fotosPreview)return;
    fotosPreview.innerHTML = state.novaPerguntaFotos.map((foto,j)=>`<div data-foto-index="${j}" style="position:relative;"><img class="foto-preview" src="${foto}" alt="Prévia da foto ${j+1}" /><button type="button" class="btn ghost small pg-remover-foto" data-foto-index="${j}" style="margin-top:6px;">Remover</button></div>`).join('');
    fotosPreview.querySelectorAll('.pg-remover-foto').forEach(btn=>btn.addEventListener('click',()=>{
      state.novaPerguntaFotos.splice(Number(btn.dataset.fotoIndex),1);
      atualizarPreviewsFotos();
    }));
  };
  atualizarPreviewsFotos();
  if (fotoInput) fotoInput.addEventListener('change', async ()=>{
    const arquivos = Array.from(fotoInput.files || []).filter(file=>file.type.startsWith('image/'));
    if (!arquivos.length) return;
    try{
      const novas = await Promise.all(arquivos.map(file=>comprimirImagem(file)));
      state.novaPerguntaFotos.push(...novas);
      atualizarPreviewsFotos();
      fotoInput.value = '';
    }catch(err){ console.error(err); toast('Não foi possível carregar uma ou mais imagens.'); }
  });

  const form = document.getElementById('form-pergunta');
  if (form) form.addEventListener('submit', e=>{
    e.preventDefault();
    const enunciado = document.getElementById('pg-enunciado').value.trim();
    const opcoes = [0,1,2,3].map(i=>document.getElementById(`pg-opcao-${i}`).value.trim());
    const correta = Number(form.querySelector('input[name="pg-correta"]:checked').value);
    const descritor = document.getElementById('pg-descritor').value.trim();
    if (!enunciado || opcoes.some(o=>!o)) return;

    const fotos = Array.isArray(state.novaPerguntaFotos) ? [...state.novaPerguntaFotos] : fotosDaPergunta(editando);
    const payload = {
      simuladoId: state.perguntasFiltroSimuladoId,
      enunciado, opcoes, respostaCorreta: correta, descritor, fotos, foto: fotos[0] || ''
    };
    if (state.editingPerguntaId){
      const pergunta = state.perguntas.find(p=>p.id===state.editingPerguntaId);
      Object.assign(pergunta, payload);
      toast('Pergunta atualizada.');
      state.editingPerguntaId = null;
    } else {
      state.perguntas.push({id: uid(), ...payload, criadoEm:Date.now()});
      toast('Pergunta adicionada.');
    }
    state.novaPerguntaFotos = null;
    salvarDados();
    render();
  });

  const cancelBtn = document.getElementById('btn-cancelar-edicao');
  if (cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.editingPerguntaId=null; state.novaPerguntaFotos=null; render(); });

  content.querySelectorAll('[data-action="edit-pergunta"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.editingPerguntaId = el.dataset.id; state.novaPerguntaFotos = null; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  });
  content.querySelectorAll('[data-action="del-pergunta"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id=el.dataset.id;
      if (!confirm('Excluir esta pergunta? Ela também deixará de aparecer nos relatórios.')) return;
      state.perguntas = state.perguntas.filter(p=>p.id!==id);
      
      state.resultados = state.resultados.map(r=>{
        if(!Array.isArray(r.detalhes)) return r;
        const detalhes=r.detalhes.filter(d=>d.perguntaId!==id);
        const acertos=detalhes.filter(d=>d.acertou).length;
        const total=detalhes.length;
        return {...r,detalhes,acertos,total,nota:total?Number((acertos/total*10).toFixed(1)):0};
      });
      salvarDados();
      toast('Pergunta excluída.');
      render();
    });
  });
}

function agregarResultados(resultados){
  const porDescritor = {};
  const porPergunta = {};
  const porAluno = {};
  const porSimulado = {};
  resultados.forEach(r=>{
    if (!porAluno[r.alunoId]) porAluno[r.alunoId] = {nome:r.alunoNome, acertos:0, total:0, tentativas:0};
    porAluno[r.alunoId].acertos += r.acertos;
    porAluno[r.alunoId].total += r.total;
    porAluno[r.alunoId].tentativas++;

    if (!porSimulado[r.simuladoId]) porSimulado[r.simuladoId] = {titulo:r.simuladoTitulo, acertos:0, total:0, tentativas:0};
    porSimulado[r.simuladoId].acertos += r.acertos;
    porSimulado[r.simuladoId].total += r.total;
    porSimulado[r.simuladoId].tentativas++;

    (r.detalhes||[]).forEach(d=>{
      const desc = d.descritor || 'Sem descritor';
      if (!porDescritor[desc]) porDescritor[desc] = {erros:0, total:0};
      porDescritor[desc].total++;
      if (!d.acertou) porDescritor[desc].erros++;

      const key = d.perguntaId + '||' + d.enunciado;
      if (!porPergunta[key]) porPergunta[key] = {enunciado:d.enunciado, descritor:d.descritor, erros:0, total:0};
      porPergunta[key].total++;
      if (!d.acertou) porPergunta[key].erros++;
    });
  });
  return {porDescritor, porPergunta, porAluno, porSimulado};
}

function emptyReport(msg){
  return `<div class="empty-state">${esc(msg)}</div>`;
}

function chartBarVertical(items, opts={}){
  if (!items.length) return emptyReport(opts.emptyMsg || 'Sem dados suficientes ainda.');
  const unit = opts.unit ?? '%';
  const max = opts.max ?? 100;
  const color = opts.color ?? 'var(--pine)';
  return `<div class="chart-bars">
    ${items.map(it=>{
      const pct = max ? Math.max(2, Math.round((it.value/max)*100)) : 0;
      return `
      <div class="chart-bar-col" title="${esc(it.title || it.label)}: ${it.value}${unit}">
        <div class="chart-bar-value">${it.value}${unit}</div>
        <div class="chart-bar-track"><div class="chart-bar-fill" style="height:${pct}%;background:${it.color || color}"></div></div>
        <div class="chart-bar-label">${esc(it.label)}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function svgLineChart(pontos){
  if (!pontos.length) return emptyReport('Sem dados suficientes ainda.');
  const w = 680, h = 240, padL = 40, padR = 16, padT = 16, padB = 34;
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;
  const n = pontos.length;
  const stepX = n>1 ? innerW/(n-1) : 0;
  const coords = pontos.map((p,i)=>{
    const x = padL + stepX*i;
    const y = padT + innerH - (Math.max(0,Math.min(100,p.value))/100)*innerH;
    return {x, y, ...p};
  });
  const pathD = coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${coords[coords.length-1].x.toFixed(1)},${(padT+innerH).toFixed(1)} L${coords[0].x.toFixed(1)},${(padT+innerH).toFixed(1)} Z`;
  const grid = [0,25,50,75,100].map(v=>{
    const y = padT + innerH - (v/100)*innerH;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--paper-line)" stroke-width="1"/><text x="${padL-8}" y="${(y+3).toFixed(1)}" font-size="10" text-anchor="end" fill="var(--ink-soft)" font-family="monospace">${v}</text>`;
  }).join('');
  const skip = Math.max(1, Math.ceil(n/12));
  const labels = coords.map((c,i)=> (i%skip===0 || i===n-1) ? `<text x="${c.x.toFixed(1)}" y="${h-10}" font-size="9" text-anchor="middle" fill="var(--ink-soft)" font-family="monospace">${esc(c.label)}</text>` : '').join('');
  const dots = coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="var(--pine-dark)"><title>${esc(c.label)}: ${c.value}%</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
    ${grid}
    <path d="${areaD}" fill="var(--pine-tint)" stroke="none" opacity="0.6"/>
    <path d="${pathD}" fill="none" stroke="var(--pine)" stroke-width="2.5"/>
    ${dots}
    ${labels}
  </svg>`;
}

function rankingList(items, opts={}){
  if (!items.length) return emptyReport(opts.emptyMsg || 'Sem dados suficientes ainda.');
  const unit = opts.unit ?? '%';
  const color = opts.color ?? 'var(--alert)';
  return items.map((it,i)=>`
    <div class="rank-row">
      <div class="rank-pos">${i+1}º</div>
      <div class="rank-info">
        <div class="rank-label" title="${esc(it.title||it.label)}">${esc(it.label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${it.value}%;background:${it.color||color}"></div></div>
      </div>
      <div class="rank-value">${it.value}${unit}</div>
    </div>
  `).join('');
}

(function(){
  function alvoEditavel(el){
    return el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.isContentEditable);
  }
  ['copy','cut'].forEach(evt=>{
    document.addEventListener(evt, e=>{
      if(!alvoEditavel(e.target)){ e.preventDefault(); }
    });
  });
  document.addEventListener('contextmenu', e=>{
    if(!alvoEditavel(e.target)){ e.preventDefault(); }
  });
  document.addEventListener('selectstart', e=>{
    if(!alvoEditavel(e.target)){ e.preventDefault(); }
  });
  document.addEventListener('dragstart', e=>{ e.preventDefault(); });
  document.addEventListener('keydown', e=>{
    const k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey) && (k==='c'||k==='x'||k==='u'||k==='s') && !alvoEditavel(e.target)){
      e.preventDefault();
    }
  });
})();

(function(){
  function abrirLightbox(src, alt){
    const overlay=document.createElement('div');
    overlay.className='fx-lightbox';
    overlay.innerHTML=`<button type="button" class="fx-lightbox-close" aria-label="Fechar">✕</button><img src="${src}" alt="${esc(alt||'')}" />`;
    function fechar(){ overlay.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e){ if(e.key==='Escape') fechar(); }
    overlay.addEventListener('click', e=>{ if(e.target===overlay) fechar(); });
    overlay.querySelector('.fx-lightbox-close').addEventListener('click', fechar);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
  }
  document.addEventListener('click', e=>{
    const img=e.target.closest('.question-photo img');
    if(img) abrirLightbox(img.src, img.alt);
  });
})();

const FEATURE_KEY = 'recursosSiteV1';
function featureData(){ try{return JSON.parse(localStorage.getItem(FEATURE_KEY)||'{}')}catch{return {}} }
function saveFeatureData(d){localStorage.setItem(FEATURE_KEY,JSON.stringify(d))}
function alunoAtualId(){return state.alunoAuthed?.id||null}
function escapeHtml(v){return esc(v==null?'':String(v))}

const _simuladoPodeSerIniciadoOriginal = simuladoPodeSerIniciado;
simuladoPodeSerIniciado = function(simulado, aluno){
  const r = _simuladoPodeSerIniciadoOriginal(simulado, aluno);
  if(!r.ok) return r;
  if(simulado && simulado.codigoAcesso){
    const chave='codigo_'+simulado.id;
    const d=featureData();
    if(d[chave]!==simulado.codigoAcesso){
      const digitado=prompt('Código de acesso do simulado:');
      if(digitado===null) return {ok:false,motivo:'Acesso cancelado.'};
      if(digitado.trim()!==simulado.codigoAcesso) return {ok:false,motivo:'Código de acesso incorreto.'};
      d[chave]=digitado.trim(); saveFeatureData(d);
    }
  }
  return r;
};

const _renderQuizOriginal = renderQuiz;
renderQuiz = function(){
  _renderQuizOriginal();
  if(!state.quizSimuladoId) return;
  const d=featureData(); const key='marcadas_'+alunoAtualId()+'_'+state.quizSimuladoId; const marcadas=new Set(d[key]||[]);
  document.querySelectorAll('.question-card').forEach(card=>{
    const texto=card.querySelector('.enunciado'); if(!texto) return;
    const num=card.querySelector('.qnum'); const idx=Number((num?.textContent.match(/Questão (\d+)/)||[])[1]||0)-1;
    const qid=state.quizPerguntaIds[idx]; if(!qid) return;
    const marcadaAgora=marcadas.has(qid);
    card.classList.toggle('marcada', marcadaAgora);
    const b=document.createElement('button'); b.type='button'; b.className='btn ghost small btn-marcar'; b.style.marginBottom='10px'; b.textContent=marcadaAgora?'★ Desmarcar revisão':'☆ Marcar para revisar';
    b.onclick=()=>{
      const dd=featureData();const kk=key;const a=new Set(dd[kk]||[]);
      if(a.has(qid)) a.delete(qid); else a.add(qid);
      dd[kk]=[...a]; saveFeatureData(dd);
      const ativa=a.has(qid);
      b.textContent=ativa?'★ Desmarcar revisão':'☆ Marcar para revisar';
      card.classList.toggle('marcada', ativa);
    };
    texto.insertAdjacentElement('beforebegin',b);
  });
};

  const r=resultadosDoRelatorioAtual(); const por={};
  r.forEach(x=>{const s=state.simulados.find(y=>y.id===x.simuladoId);const c=s?.conteudo||'Geral';if(!por[c])por[c]={a:0,t:0};por[c].a+=x.acertos;por[c].t+=x.total;});
  const card=document.createElement('div');card.className='card';card.style.cssText='margin-top:16px;padding:18px';
  card.innerHTML='<div class="section-head"><h2 style="font-size:17px;margin:0">Desempenho por conteúdo</h2></div>'+(Object.keys(por).length?Object.entries(por).sort((a,b)=>(b[1].a/b[1].t)-(a[1].a/a[1].t)).map(([c,v])=>`<div class="bar-row"><div class="label">${escapeHtml(c)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v.a/v.t*100)}%"></div></div><div class="pct">${Math.round(v.a/v.t*100)}%</div></div>`).join(''):'<p class="muted">Ainda não há resultados.</p>');
  content.appendChild(card);
};

</script>
