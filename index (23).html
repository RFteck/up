<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UP · Simulados</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23ffffff%27/%3E%3Cpath d=%27M13 16v17c0 12 7 18 19 18s19-6 19-18V16h-9v16c0 7-3 10-10 10s-10-3-10-10V16z%27 fill=%27%232f6bff%27/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1C2B39;
    --ink-soft:#3E4E5C;
    --paper:#EDEBDD;
    --paper-card:#F7F5EA;
    --paper-line:#D8D4C0;
    --pine:#2F6B5E;
    --pine-dark:#20463D;
    --pine-tint:#DCE7E1;
    --ochre:#C88A3D;
    --ochre-tint:#F3E3CB;
    --water:#3E6E8C;
    --water-tint:#DDE7ED;
    --alert:#B23B3B;
    --alert-tint:#F2DBD8;
    --white:#FFFFFF;
    --accent:#8B7CD8;
    --accent-tint:#E7E3F7;
    --radius:10px;
    --shadow: 0 1px 2px rgba(28,43,57,.06), 0 6px 18px rgba(28,43,57,.08);
    --shadow-lg: 0 4px 10px rgba(28,43,57,.07), 0 16px 34px rgba(28,43,57,.11);
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  ::selection{background:var(--accent-tint);color:var(--ink);}

  body, .question-card, .enunciado, .option, main#app{
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;
  }
  input, textarea, [contenteditable="true"]{
    -webkit-user-select:text; -moz-user-select:text; user-select:text;
  }

  .brand-logo{
    display:block;
    height:40px;
    width:auto;
    filter:drop-shadow(0 2px 5px rgba(28,43,57,.18));
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 14% -6%, rgba(139,124,216,.10), transparent 42%),
      radial-gradient(circle at 100% 4%, rgba(200,138,61,.09), transparent 38%),
      repeating-radial-gradient(circle at 12% -10%, transparent 0 46px, rgba(47,107,94,.07) 47px 48px, transparent 49px 94px),
      repeating-radial-gradient(circle at 108% 10%, transparent 0 60px, rgba(200,138,61,.07) 61px 62px, transparent 63px 122px);
    background-attachment:fixed;
  }

  a{color:inherit;}

  header.site{
    padding:22px clamp(16px,4vw,48px) 0;
    max-width:1140px;
    margin:0 auto;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:16px;
    background:linear-gradient(135deg, var(--paper-card), var(--paper));
    border:1px solid var(--paper-line);
    border-radius:16px;
    padding:12px 20px;
    box-shadow:var(--shadow);
  }
  .brand svg{flex:none;}
  .brand .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    background:linear-gradient(90deg,var(--pine),var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:700;
    margin:0 0 2px;
  }
  .brand h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(24px,3.2vw,34px);
    margin:0;
    color:var(--ink);
    letter-spacing:-.01em;
  }
  .brand .prof{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  nav.tabs{
    display:flex;
    gap:6px;
    margin:22px 0 0;
    border-bottom:1px solid var(--paper-line);
  }
  nav.tabs button{
    font-family:var(--font-mono);
    font-size:12.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    background:none;
    border:none;
    padding:11px 16px;
    cursor:pointer;
    color:var(--ink-soft);
    position:relative;
    top:1px;
    border-bottom:2px solid transparent;
    border-radius:8px 8px 0 0;
    transition:background .15s ease, color .15s ease;
  }
  nav.tabs button.active{
    color:var(--pine-dark);
    border-bottom-color:var(--pine);
    font-weight:700;
    background:rgba(47,107,94,.08);
  }
  nav.tabs button:hover{color:var(--pine-dark);background:rgba(47,107,94,.06);}


  .organized-nav{
    display:flex;
    align-items:stretch;
    gap:8px;
    flex-wrap:wrap;
    padding:10px;
    background:rgba(247,245,234,.72);
    border:1px solid var(--paper-line);
    border-radius:14px;
    box-shadow:var(--shadow);
    position:sticky;
    top:10px;
    z-index:20;
    backdrop-filter:blur(10px);
  }
  .nav-group{
    display:flex;
    align-items:center;
    gap:4px;
    padding:3px;
    border:1px solid rgba(216,212,192,.75);
    border-radius:10px;
    background:rgba(255,255,255,.38);
  }
  .nav-group-title{
    display:none;
  }
  .organized-nav button{
    white-space:nowrap;
    border-radius:8px;
    padding:9px 12px;
  }
  .organized-nav button.active{
    box-shadow:0 2px 7px rgba(28,43,57,.10);
  }
  @media (max-width:820px){
    .organized-nav{
      position:static;
      overflow-x:auto;
      flex-wrap:nowrap;
      align-items:stretch;
    }
    .nav-group{
      flex:0 0 auto;
    }
  }
  @media (max-width:560px){
    .organized-nav{
      margin-left:-4px;
      margin-right:-4px;
      padding:7px;
    }
    .organized-nav button{
      font-size:11px;
      padding:8px 10px;
    }
  }

  main#app{
    max-width:1100px;
    margin:0 auto;
    padding:28px clamp(16px,4vw,48px) 80px;
  }

  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .section-head h2{
    font-family:var(--font-display);
    font-size:22px;
    margin:0;
    font-weight:600;
  }
  .muted{color:var(--ink-soft);}
  .badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:100px;
    font-weight:700;
  }
  .badge.on{background:var(--pine-tint);color:var(--pine-dark);}
  .badge.off{background:#E7E4D6;color:var(--ink-soft);}
  .badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;}

  button.btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--white);
    padding:9px 16px;
    border-radius:9px;
    cursor:pointer;
    transition:transform .12s ease, opacity .15s ease, box-shadow .15s ease;
  }
  button.btn:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 4px 12px rgba(28,43,57,.18);}
  button.btn:active{transform:translateY(1px);box-shadow:none;}
  button.btn.ghost{background:transparent;color:var(--ink);border-color:var(--paper-line);}
  button.btn.ghost:hover{border-color:var(--ink);box-shadow:none;}
  button.btn.pine{background:linear-gradient(135deg,var(--pine),var(--pine-dark));border-color:var(--pine);}
  button.btn.danger{background:transparent;color:var(--alert);border-color:var(--alert-tint);}
  button.btn.danger:hover{background:var(--alert-tint);}
  button.btn.small{padding:6px 11px;font-size:12.5px;border-radius:6px;}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}

  input[type=text],input[type=password],textarea,select{
    font-family:var(--font-body);
    font-size:14px;
    padding:9px 11px;
    border:1px solid var(--paper-line);
    border-radius:7px;
    background:var(--white);
    color:var(--ink);
    width:100%;
  }
  input:focus,textarea:focus,select:focus{outline:2px solid var(--pine);outline-offset:1px;}
  label.field-label{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--ink-soft);
    display:block;
    margin:0 0 5px;
  }
  .field{margin-bottom:14px;}

  .card{
    background:var(--paper-card);
    border:1px solid var(--paper-line);
    border-radius:14px;
    box-shadow:var(--shadow);
    transition:box-shadow .18s ease, transform .18s ease;
  }
  .sim-card:hover, .list-row:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
  .materia-grupo h3{
    display:flex;align-items:center;gap:10px;
  }
  .materia-grupo h3::before{
    content:"";width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--pine));
    flex:none;
  }

  .name-gate{
    max-width:420px;
    margin:40px auto;
    padding:26px;
    text-align:center;
  }
  .name-gate h2{font-family:var(--font-display);font-size:22px;margin:0 0 6px;}
  .grid-simulados{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:16px;
  }
  .sim-card{
    padding:18px;
    position:relative;
    border-style:dashed;
  }
  .sim-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
  .sim-card h3{font-family:var(--font-display);font-size:18px;margin:0 0 6px;font-weight:600;}
  .sim-card p{font-size:13.5px;color:var(--ink-soft);margin:0 0 14px;min-height:20px;}
  .sim-card .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin-bottom:12px;}
  .empty-state{
    padding:36px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-family:var(--font-mono);
    font-size:13px;
    border:1px dashed var(--paper-line);
    border-radius:var(--radius);
  }

  .quiz-header{margin-bottom:18px;}
  .quiz-header .eyebrow{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--pine);}
  .progress-bar{height:6px;border-radius:100px;background:var(--paper-line);overflow:hidden;margin-top:10px;}
  .progress-bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--pine),var(--ochre));}
  .question-card{padding:20px;margin-bottom:14px;position:relative;transition:box-shadow .15s ease;}
  .question-card.marcada{
    border-left:5px solid var(--alert);
    background:linear-gradient(90deg, var(--alert-tint) 0%, var(--paper-card) 42px);
    box-shadow:var(--shadow-lg);
  }
  .btn-marcar{font-family:var(--font-mono);letter-spacing:.02em;}
  .question-card .qnum{font-family:var(--font-mono);font-size:11px;color:var(--pine);margin-bottom:6px;}
  .question-card p.enunciado{font-size:16px;font-weight:600;margin:0 0 14px;}
  .texto-apoio{
    margin:0 0 14px;padding:14px 16px;border:1px solid var(--paper-line);border-left:3px solid var(--water);
    border-radius:8px;background:var(--paper-card);color:var(--ink-soft);
    font-size:14px;line-height:1.6;white-space:pre-wrap;
  }
  .texto-apoio::before{content:"Texto de apoio";display:block;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--water);margin-bottom:6px;}
  .opcao{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;
    border:1px solid var(--paper-line);
    border-radius:8px;
    margin-bottom:8px;
    cursor:pointer;
    background:var(--white);
    font-size:14px;
  }
  .opcao:hover{border-color:var(--pine);}
  .opcao.selected{border-color:var(--pine);background:var(--pine-tint);font-weight:600;}
  .opcao input{accent-color:var(--pine);}
  .opcao.correta{border-color:var(--pine);background:var(--pine-tint);}
  .opcao.errada{border-color:var(--alert);background:var(--alert-tint);}
  .quiz-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}

  .result-hero{
    padding:28px;
    text-align:center;
    margin-bottom:20px;
  }
  .result-hero .score{
    font-family:var(--font-display);
    font-size:56px;
    font-weight:700;
    color:var(--pine-dark);
    line-height:1;
  }
  .result-hero .score small{font-size:22px;color:var(--ink-soft);font-weight:500;}
  .review-item{padding:16px 18px;margin-bottom:10px;}
  .review-item .tag-descritor{
    font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--water);background:var(--water-tint);padding:2px 8px;border-radius:100px;display:inline-block;margin-bottom:8px;
  }

  .login-gate{max-width:380px;margin:50px auto;padding:28px;text-align:center;}
  .login-gate h2{font-family:var(--font-display);margin:0 0 4px;font-size:22px;}

  .subtabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .subtabs button{
    font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;
    background:var(--white);border:1px solid var(--paper-line);border-radius:100px;
    padding:7px 14px;cursor:pointer;color:var(--ink-soft);
  }
  .subtabs button.active{background:var(--ink);color:var(--white);border-color:var(--ink);}

  table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.data-table th{
    text-align:left;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--ink-soft);border-bottom:1px solid var(--paper-line);padding:8px 10px;
  }
  table.data-table td{padding:10px;border-bottom:1px solid var(--paper-line);vertical-align:top;}
  table.data-table tr:last-child td{border-bottom:none;}

  .switch{position:relative;display:inline-block;width:38px;height:22px;flex:none;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;cursor:pointer;inset:0;background:#C9C4AE;border-radius:100px;transition:.15s;}
  .switch .slider::before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:white;border-radius:50%;transition:.15s;}
  .switch input:checked + .slider{background:var(--pine);}
  .switch input:checked + .slider::before{transform:translateX(16px);}

  .list-row{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:14px 16px;border-bottom:1px solid var(--paper-line);
  }
  .list-row:last-child{border-bottom:none;}
  .list-row .info h4{margin:0 0 3px;font-family:var(--font-display);font-size:15.5px;font-weight:600;}
  .list-row .info p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .row-actions{display:flex;align-items:center;gap:8px;flex:none;}

  form.panel-form{padding:18px;margin-bottom:22px;}
  form.panel-form .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:600px){form.panel-form .grid-2{grid-template-columns:1fr;}}

  .opcao-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .opcao-row input[type=radio]{accent-color:var(--pine);flex:none;}
  .opcao-row input[type=text]{flex:1;}
  .opcao-row .letra{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);width:16px;}

  .tipo-pergunta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .questao-editor-box{padding:14px;border:1px solid var(--paper-line);border-radius:10px;background:rgba(255,255,255,.34);}
  .matching-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:9px;}
  .matching-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-bottom:9px;}
  .matching-label{padding:9px 11px;border:1px solid var(--paper-line);border-radius:7px;background:var(--white);font-size:13px;}
  .match-answer{font-size:13px;}
  .texto-resposta{min-height:90px;resize:vertical;}
  .quiz-text-answer{min-height:100px;resize:vertical;}
  .quiz-matching{display:grid;gap:10px;}
  .quiz-match-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;}
  .quiz-match-left{padding:11px 12px;border:1px solid var(--paper-line);border-radius:8px;background:var(--white);font-size:14px;font-weight:600;}
  @media(max-width:600px){.tipo-pergunta-grid,.matching-grid,.matching-row,.quiz-match-row{grid-template-columns:1fr;}}

  .foto-preview-wrap{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-top:4px;}
  .foto-preview{max-width:220px;max-height:150px;border-radius:8px;border:1px solid var(--paper-line);display:block;object-fit:cover;}
  input[type=file]{
    font-family:var(--font-body);font-size:13px;padding:8px;border:1px dashed var(--paper-line);
    border-radius:7px;background:var(--white);width:100%;cursor:pointer;
  }
  .question-photo{margin-bottom:14px;}
  .question-photo img{max-width:100%;max-height:320px;border-radius:8px;display:block;border:1px solid var(--paper-line);object-fit:contain;background:var(--white);cursor:zoom-in;transition:box-shadow .15s ease, transform .15s ease;}
  .question-photo img:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
  .review-item .question-photo img{max-height:220px;}

  .fx-lightbox{position:fixed;inset:0;background:rgba(15,20,26,.92);display:flex;align-items:center;justify-content:center;padding:12px;z-index:9999;cursor:zoom-out;animation:fxFadeIn .15s ease;}
  .fx-lightbox img{max-width:98vw;max-height:96vh;width:auto;height:auto;border-radius:10px;box-shadow:var(--shadow-lg);object-fit:contain;background:var(--white);cursor:default;}
  .fx-lightbox .fx-lightbox-close{position:fixed;top:16px;right:16px;width:46px;height:46px;border-radius:50%;border:none;background:var(--paper-card);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;box-shadow:var(--shadow-lg);z-index:10000;}
  .fx-lightbox .fx-lightbox-close:hover{background:var(--white);}
  @keyframes fxFadeIn{from{opacity:0}to{opacity:1}}

  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
  .stat-card{padding:16px;}
  .stat-card .num{font-family:var(--font-display);font-size:30px;font-weight:700;color:var(--pine-dark);}
  .stat-card .lbl{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.05em;}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-row .label{width:150px;flex:none;font-size:13px;font-weight:600;}
  .bar-track{flex:1;height:10px;background:var(--paper-line);border-radius:100px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--alert);}
  .bar-row .pct{width:44px;flex:none;text-align:right;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);}

  .chart-bars{display:flex;align-items:flex-end;gap:16px;height:230px;padding:10px 6px 0;overflow-x:auto;}
  .chart-bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:54px;flex:none;height:100%;}
  .chart-bar-value{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin-bottom:6px;white-space:nowrap;}
  .chart-bar-track{width:30px;height:100%;background:var(--paper-line);border-radius:6px 6px 0 0;display:flex;align-items:flex-end;overflow:hidden;}
  .chart-bar-fill{width:100%;border-radius:6px 6px 0 0;background:var(--pine);transition:height .25s ease;}
  .chart-bar-label{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);margin-top:8px;max-width:72px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chart-bar-n{font-family:var(--font-mono);font-size:9px;color:var(--ink-soft);opacity:.7;margin-top:2px;}
  .rank-n{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);font-weight:400;}
  .alert-box{background:var(--alert-tint);border:1px solid var(--alert);border-radius:10px;padding:12px 16px;margin-bottom:16px;}
  .alert-box strong{color:var(--alert);}

  .rank-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--paper-line);}
  .rank-row:last-child{border-bottom:none;}

async function hashSenha(senha){
  const dados=new TextEncoder().encode(String(senha));
  const buffer=await crypto.subtle.digest('SHA-256',dados);
  return Array.from(new Uint8Array(buffer)).map(b=>b.toString(16).padStart(2,'0')).join('');

function escutarDados(){
  onSnapshot(configDocRef, snap=>{

    if (snap.metadata.hasPendingWrites) {
      return;
    }
    const data = snap.exists() ? snap.data() : {};
    state.alunos = Array.isArray(data.alunos) ? data.alunos : [];
    state.professores = Array.isArray(data.professores) ? data.professores : [];
    state.turmas = Array.isArray(data.turmas) ? data.turmas : [];
    state.preferenciasProfessores = data.preferenciasProfessores && typeof data.preferenciasProfessores==='object' ? data.preferenciasProfessores : (state.preferenciasProfessores||{});
    state.alunos.forEach(a=>{
      if (!Array.isArray(a.turmaIds)) a.turmaIds = a.turmaId ? [a.turmaId] : [];
      a.login = String(a.login ?? '').trim();
      a.nome = String(a.nome ?? '').trim();
    });
    state.professores.forEach(p=>{
      p.login = String(p.login ?? '').trim();
      p.nome = String(p.nome ?? '').trim();
      if (p.ativo === undefined) p.ativo = true;
    });
    migrarSenhasLegadas();
    state.turmas.forEach(t=>{
      if (!Array.isArray(t.alunoIds)) t.alunoIds = [];
      if (!Array.isArray(t.simuladoIds)) t.simuladoIds = [];
    });
    configCarregado = true;
    aoAtualizarDados();
  }, tratarErroFirebase);

  onSnapshot(simuladosColRef, snap=>{
    if (snap.metadata.hasPendingWrites) return;
    simuladosRemotoIds = new Set(snap.docs.map(d=>d.id));
    state.simulados = snap.docs.map(d=>{
      const s = {...d.data()};
      s.conteudo = s.conteudo || 'Geral';
      s.valorTotal = Number(s.valorTotal ?? 10);
      s.instrucoes = s.instrucoes || '';
      return s;
    });
    simuladosCarregado = true;
    aoAtualizarDados();
  }, tratarErroFirebase);

  onSnapshot(perguntasColRef, snap=>{
    if (snap.metadata.hasPendingWrites) return;
    perguntasRemotoIds = new Set(snap.docs.map(d=>d.id));
    state.perguntas = snap.docs.map(d=>{
      const p={...d.data()};
      p.enunciado=String(p.enunciado ?? '');
      p.textoApoio=String(p.textoApoio ?? '');
      p.descritor=String(p.descritor ?? '');
      p.habilidade=String(p.habilidade ?? '');
      p.tipo=p.tipo || 'multipla';
      return p;
    });
    perguntasCarregado = true;
    aoAtualizarDados();
  }, tratarErroFirebase);

  onSnapshot(resultadosColRef, snap=>{
    if (snap.metadata.hasPendingWrites) return;
    resultadosRemotoIds = new Set(snap.docs.map(d=>d.id));
    state.resultados = snap.docs.map(d=>d.data());
    resultadosCarregado = true;
    aoAtualizarDados();
  }, tratarErroFirebase);

  onSnapshot(alunosColRef, snap=>{
    if (snap.metadata.hasPendingWrites) return;
    alunosRemotoIds = new Set(snap.docs.map(d=>d.id));
    if (snap.docs.length) {
      state.alunos = snap.docs.map(d=>d.data());
      state.alunos.forEach(a=>{
        if(!Array.isArray(a.turmaIds)) a.turmaIds = a.turmaId ? [a.turmaId] : [];
        a.login = String(a.login ?? '').trim();
        a.nome = String(a.nome ?? '').trim();
      });
    }
    alunosCarregado = true;
    aoAtualizarDados();
  }, tratarErroFirebase);
}

function limparReferenciasInexistentes(){
  let mudou=false;
  const alunoIds=new Set(state.alunos.map(a=>a.id));
  const simIds=new Set(state.simulados.map(s=>s.id));
  state.turmas.forEach(t=>{
    const alunos=Array.isArray(t.alunoIds)?t.alunoIds:[];
    const simulados=Array.isArray(t.simuladoIds)?t.simuladoIds:[];
    const novosAlunos=alunos.filter(id=>alunoIds.has(id));
    const novosSimulados=simulados.filter(id=>simIds.has(id));
    if(novosAlunos.length!==alunos.length||novosSimulados.length!==simulados.length)mudou=true;
    t.alunoIds=novosAlunos;
    t.simuladoIds=novosSimulados;
  });
  state.alunos.forEach(a=>{
    if(!Array.isArray(a.turmaIds))a.turmaIds=[];
    const novas=a.turmaIds.filter(id=>state.turmas.some(t=>t.id===id));
    if(novas.length!==a.turmaIds.length)mudou=true;
    a.turmaIds=novas;
  });
  return mudou;
}

async function salvarDados(){
  salvarEstadoLocal();
  configSalvarNovamente=true;
  if(configSalvando)return;
  configSalvando=true;
  while(configSalvarNovamente){
    configSalvarNovamente=false;
    const configAtual={
      alunos:state.alunos.map(x=>{const y={...x};delete y.senha;return y;}),
      professores:state.professores.map(x=>{const y={...x};delete y.senha;return y;}),
      turmas:state.turmas.map(x=>({...x,alunoIds:[...(x.alunoIds||[])],simuladoIds:[...(x.simuladoIds||[])]})),
      preferenciasProfessores: {...(state.preferenciasProfessores||{})}
    };
    const escritas=[];
    const configJson=JSON.stringify(configAtual);
    try{
      if(configJson!==ultimaConfiguracaoGravada){
        await setDoc(configDocRef,configAtual);
        ultimaConfiguracaoGravada=configJson;
      }
      const idsLocaisAlunos=new Set();
      const alunosPendentes=new Map();
      for(const a of state.alunos){
        if(!a?.id)continue;
        idsLocaisAlunos.add(a.id);
        const json=JSON.stringify(a);
        if(alunosGravados.get(a.id)!==json){
          escritas.push(setDoc(doc(alunosColRef,a.id),a));
          alunosPendentes.set(a.id,json);
        }
      }
      const podeExcluir = (carregado, idsLocais, idsRemotos) => carregado && !(idsLocais.size===0 && idsRemotos.size>0);

      if (podeExcluir(alunosCarregado, idsLocaisAlunos, alunosRemotoIds)) {
        for(const id of alunosRemotoIds){
          if(!idsLocaisAlunos.has(id)){
            escritas.push(deleteDoc(doc(alunosColRef,id)));
            alunosGravados.delete(id);
          }
        }
      } else if (idsLocaisAlunos.size===0 && alunosRemotoIds.size>0) {
        console.warn('Sincronização de alunos abortada: lista local vazia com dados no servidor. Nada foi excluído.');
      }

      const idsLocaisSimulados=new Set();
      const simuladosPendentes=new Map();
      for(const s of state.simulados){
        if(!s?.id)continue;
        idsLocaisSimulados.add(s.id);
        const json=JSON.stringify(s);
        if(simuladosGravados.get(s.id)!==json){
          escritas.push(setDoc(doc(simuladosColRef,s.id),s));
          simuladosPendentes.set(s.id,json);
        }
      }
      if (podeExcluir(simuladosCarregado, idsLocaisSimulados, simuladosRemotoIds)) {
        for(const id of simuladosRemotoIds){
          if(!idsLocaisSimulados.has(id)){
            escritas.push(deleteDoc(doc(simuladosColRef,id)));
            simuladosGravados.delete(id);
          }
        }
      } else if (idsLocaisSimulados.size===0 && simuladosRemotoIds.size>0) {
        console.warn('Sincronização de simulados abortada: lista local vazia com dados no servidor. Nada foi excluído.');
      }

      const idsLocaisPerguntas=new Set();
      const perguntasPendentes=new Map();
      for(const p of state.perguntas){
        if(!p?.id)continue;
        idsLocaisPerguntas.add(p.id);
        const json=JSON.stringify(p);
        if(perguntasGravadas.get(p.id)!==json){
          escritas.push(setDoc(doc(perguntasColRef,p.id),p));
          perguntasPendentes.set(p.id,json);
        }
      }
      if (podeExcluir(perguntasCarregado, idsLocaisPerguntas, perguntasRemotoIds)) {
        for(const id of perguntasRemotoIds){
          if(!idsLocaisPerguntas.has(id)){
            escritas.push(deleteDoc(doc(perguntasColRef,id)));
            perguntasGravadas.delete(id);
          }
        }
      } else if (idsLocaisPerguntas.size===0 && perguntasRemotoIds.size>0) {
        console.warn('Sincronização de perguntas abortada: lista local vazia com dados no servidor. Nada foi excluído.');
      }
      const idsLocaisResultados=new Set();
      const resultadosPendentes=new Map();
      for(const r of state.resultados){
        if(!r?.id)continue;
        idsLocaisResultados.add(r.id);
        const json=JSON.stringify(r);
        if(resultadosGravados.get(r.id)!==json){
          escritas.push(setDoc(doc(resultadosColRef,r.id),r));
          resultadosPendentes.set(r.id,json);
        }
      }
      if (podeExcluir(resultadosCarregado, idsLocaisResultados, resultadosRemotoIds)) {
        for(const id of resultadosRemotoIds){
          if(!idsLocaisResultados.has(id)){
            escritas.push(deleteDoc(doc(resultadosColRef,id)));
            resultadosGravados.delete(id);
          }
        }
      } else if (idsLocaisResultados.size===0 && resultadosRemotoIds.size>0) {
        console.warn('Sincronização de resultados abortada: lista local vazia com dados no servidor. Nada foi excluído.');
      }
      if(escritas.length)await Promise.all(escritas);
      for(const [id,json] of simuladosPendentes) simuladosGravados.set(id,json);
      for(const [id,json] of alunosPendentes) alunosGravados.set(id,json);
      for(const [id,json] of perguntasPendentes) perguntasGravadas.set(id,json);
      for(const [id,json] of resultadosPendentes) resultadosGravados.set(id,json);
      falhasSeguidasSalvar = 0;
    }catch(err){
      console.error('Firebase: falha ao salvar',err);
      falhasSeguidasSalvar++;
      if(falhasSeguidasSalvar>=5){
        toast('Não foi possível salvar os dados no servidor. Verifique sua internet e tente novamente.');
        configSalvarNovamente=false;
        break;
      }
      configSalvarNovamente=true;
      await new Promise(r=>setTimeout(r,1200*falhasSeguidasSalvar));
    }
  }
  configSalvando=false;
  salvarEstadoLocal();
}

function comprimirImagem(file, maxLado=900, qualidade=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Falha ao ler imagem'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Falha ao processar imagem'));
      img.onload = () => {
        let {width, height} = img;
        if (width > maxLado || height > maxLado){
          const escala = maxLado / Math.max(width, height);
          width = Math.round(width * escala);
          height = Math.round(height * escala);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function tentativasDoAluno(alunoId, simuladoId){
  return state.resultados.filter(r=>r.alunoId===alunoId && r.simuladoId===simuladoId).length;

function simuladoPodeSerIniciado(simulado, aluno){
  if (!simulado || !aluno) return {ok:false, motivo:'Simulado indisponível.'};
  if (simulado.ativo === false) return {ok:false, motivo:'Este simulado não está disponível.'};
  const agora=Date.now();
  if (simulado.abertura && agora < simulado.abertura) return {ok:false, motivo:'Abertura: '+new Date(simulado.abertura).toLocaleString('pt-BR')};
  if (simulado.encerramento && agora > simulado.encerramento) return {ok:false, motivo:'Este simulado já foi encerrado.'};
  if (simulado.maxTentativas && tentativasDoAluno(aluno.id,simulado.id) >= simulado.maxTentativas) return {ok:false, motivo:'Você já atingiu o limite de tentativas.'};
  if (!perguntasDoSimulado(simulado.id).length) return {ok:false, motivo: perguntasCarregado ? 'Este simulado ainda não possui perguntas.' : 'Carregando perguntas…'};
  return {ok:true};
}
function embaralhar(arr){
  const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;
}

function normalizarRespostaTexto(valor){
  return String(valor ?? '').trim().toLocaleLowerCase('pt-BR')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,' ');
}
function respostaPreenchidaPergunta(p, resposta){
  if(resposta === undefined || resposta === null) return false;
  if(p.tipo === 'texto') return String(resposta).trim().length > 0;
  if(p.tipo === 'associacao'){
    const pares = Array.isArray(p.pares) ? p.pares : [];
    return pares.length > 0 && pares.every((_,i)=>resposta?.[i] !== undefined && resposta?.[i] !== '');
  }
  return resposta !== '';
}
function corrigirPergunta(p, resposta){
  const tipo=p.tipo || 'multipla';
  if(tipo==='texto'){
    const aceitas=Array.isArray(p.respostasAceitas) && p.respostasAceitas.length
      ? p.respostasAceitas : [p.respostaTexto||''];
    return aceitas.map(normalizarRespostaTexto).filter(Boolean).includes(normalizarRespostaTexto(resposta));
  }
  if(tipo==='verdadeiro_falso') return String(resposta)===String(p.respostaCorreta);
  if(tipo==='associacao'){
    const pares=Array.isArray(p.pares)?p.pares:[];
    if(!Array.isArray(resposta) || resposta.length!==pares.length) return false;
    return pares.every((par,i)=>Number(resposta[i])===Number(par.correta));
  }
  return Number(resposta)===Number(p.respostaCorreta);
}

      corpo=`<div class="quiz-matching-dnd" data-pergunta="${p.id}">
        <div class="dnd-col">
          <div class="dnd-title">Arraste os blocos</div>
          <div class="dnd-items">
            ${pares.map((par,idx)=>{
              const alvo=respostas[idx];
              return `<div class="dnd-item ${alvo!==undefined&&alvo!==''?'dropped':''}" draggable="true" data-dnd-source="${idx}" data-pergunta="${p.id}">

    el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));
    el.addEventListener('drop',e=>{
      e.preventDefault();
      el.classList.remove('drag-over');
      let data;
      try{ data=JSON.parse(e.dataTransfer.getData('text/plain')); }catch(_){ return; }
      const id=el.dataset.pergunta, target=Number(el.dataset.dndTarget), source=Number(data.source);
      if(data.id!==id || !Number.isFinite(source)||!Number.isFinite(target)) return;
      if(!Array.isArray(state.quizRespostas[id])) state.quizRespostas[id]=[];
      const anterior=state.quizRespostas[id].findIndex(v=>Number(v)===target);
      if(anterior>=0) state.quizRespostas[id][anterior]='';
      state.quizRespostas[id][source]=target;
      salvarEstadoLocal();
      const n=perguntas.filter(x=>respostaPreenchidaPergunta(x,state.quizRespostas[x.id])).length;

      renderQuiz();

    if (document.__upQuizExitHandler){

      document.__upQuizExitHandler = null;
    }
    const detalhes = perguntas.map(p=>{
      const respostaAluno = state.quizRespostas[p.id];
      const acertou = corrigirPergunta(p,respostaAluno);
      return {
        perguntaId: p.id,
        enunciado: p.enunciado,
        textoApoio: p.textoApoio || '',
        tipo: p.tipo||'multipla',
        opcoes: p.opcoes || [],
        pares: p.pares || [],
        respostaTexto: p.respostaTexto || '',
        respostasAceitas: p.respostasAceitas || [],
        descritor: p.descritor || '',
        habilidade: p.habilidade || '',
        foto: p.foto || '',
        fotos: p.fotos || [],
        respostaAluno,
        respostaCorreta: p.respostaCorreta,
        acertou
      };
    });
    const acertos = detalhes.filter(d=>d.acertou).length;
    const detalhesParaSalvar = detalhes.map(d=>{
      const {foto, fotos, ...resto} = d;
      return resto;
    });
    const resultado = {
      id: uid(), simuladoId: simulado.id, simuladoTitulo: simulado.titulo,
      alunoId: state.alunoAuthed.id, alunoNome: state.alunoAuthed.nome,

      total: perguntas.length, nota: perguntas.length ? Number((acertos/perguntas.length*10).toFixed(1)) : 0,
      detalhes: detalhesParaSalvar
    };
    state.resultados.unshift(resultado);
    state.quizResultado = {...resultado, detalhes};
    state.quizSimuladoId = null; state.quizRespostas = {};
    state.quizPerguntaIds=[]; state.quizFimEm=null; state.quizIniciadoEm=null;
    salvarEstadoLocal(); render();
    salvarComAvisoDeAtraso(salvarDados(), 'Salvando seu resultado no servidor…');
  }
  document.getElementById('btn-enviar-quiz').addEventListener('click', ()=>finalizarQuiz(false));
}

function baixarArquivo(nome, conteudo, tipo='text/plain;charset=utf-8'){
  const blob = new Blob([conteudo], {type: tipo});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function csvEsc(v){
  return '"' + String(v ?? '').replace(/"/g,'""') + '"';
}

function alunosFiltradosPorTurma(filtro='todas') {
  if (filtro === 'todas') return state.alunos;
  return state.alunos.filter(a=>turmasDoAluno(a.id).some(t=>t.id===filtro));
}

function resultadosFiltradosPorTurma(filtro='todas') {

  
  const simIds = simuladoIdsVisiveis();
  let base = state.resultados.filter(r=>simIds.has(r.simuladoId));
  if (filtro === 'todas') return base;
  const ids = new Set(alunosFiltradosPorTurma(filtro).map(a=>a.id));
  return base.filter(r=>ids.has(r.alunoId));
}

function resultadosDoRelatorioAtual() {
  const simuladosAtuais = new Map(state.simulados.map(s=>[s.id,s]));
  const perguntasAtuais = new Map(state.perguntas.map(p=>[p.id,p]));
  return resultadosFiltradosPorTurma(state.relatorioTurmaId)
    .filter(r=>simuladosAtuais.has(r.simuladoId))
    .map(r=>{
      const detalhes=Array.isArray(r.detalhes)?r.detalhes
        .filter(d=>perguntasAtuais.has(d.perguntaId))
        .map(d=>{
          const p=perguntasAtuais.get(d.perguntaId);
          return {
            ...d,
            enunciado:p.enunciado ?? d.enunciado ?? '',
            textoApoio:p.textoApoio ?? d.textoApoio ?? '',
            descritor:p.descritor ?? d.descritor ?? '',
            habilidade:p.habilidade ?? d.habilidade ?? '',
            tipo:p.tipo ?? d.tipo,
            opcoes:Array.isArray(p.opcoes)?p.opcoes:(d.opcoes||[]),
            pares:Array.isArray(p.pares)?p.pares:(d.pares||[]),
            respostaTexto:p.respostaTexto ?? d.respostaTexto ?? '',
            respostasAceitas:Array.isArray(p.respostasAceitas)?p.respostasAceitas:(d.respostasAceitas||[]),
            fotos:fotosDaPergunta(p).length?fotosDaPergunta(p):fotosDaPergunta(d),
            foto:p.foto||d.foto||''
          };
        }):[];
      const acertos=detalhes.filter(d=>d.acertou).length;
      const total=detalhes.length;
      return {
        ...r,
        detalhes,
        acertos,
        total,
        nota: total ? Number((acertos/total*10).toFixed(1)) : 0
      };
    });
}

    const janela=window.open('','_blank');if(!janela){toast('Permita pop-ups para imprimir.');return;}janela.document.open();janela.document.write(html);janela.document.close();janela.focus();janela.onload=()=>janela.print();setTimeout(()=>{try{janela.print()}catch(e){}},500);

}

      ${state.alunos.filter(a=>a.ativo===false).length===0?'<div class="empty-state">Nenhum aluno desativado.</div>':state.alunos.filter(a=>a.ativo===false).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map(a=>`<div class="list-row"><div class="info"><h4>${esc(a.nome)}</h4><p>login: <strong>${esc(a.login)}</strong> · ${resultadosDoAluno(a.id).length} tentativa(s) preservada(s)</p></div><div class="row-actions"><button class="btn ghost small" data-action="reativar-aluno" data-id="${a.id}">Reativar</button><button class="btn danger small" data-action="excluir-aluno-permanente" data-id="${a.id}">Excluir permanentemente</button></div></div>`).join('')}

  }));

    const p = state.professores.find(x=>x.id===el.dataset.id);

  }));
  content.querySelectorAll('[data-action="excluir-aluno-permanente"]').forEach(el=>el.addEventListener('click',()=>{
    const a=state.alunos.find(x=>x.id===el.dataset.id);if(!a)return;

              const qtd = perguntasDoSimulado(s.id).length;
              return `<label style="display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--paper-line);border-radius:10px;cursor:pointer;">
                <input type="checkbox" data-action="toggle-simulado-turma" data-id="${s.id}" ${checked?'checked':''} />
                <span><strong>${esc(s.titulo)}</strong><small class="muted" style="display:block;">${esc(s.conteudo||'Geral')} · ${qtd} pergunta(s)</small></span>
              </label>`;
            }).join('')}
          </div>`}
      </div>

      <div class="card">
        <div class="section-head"><h2 style="font-size:17px;">Alunos da turma</h2></div>
        ${state.alunos.length===0 ? `<p class="muted">Cadastre alunos primeiro na aba "Alunos".</p>` : (()=>{
          const idsNaTurma = new Set(turma?.alunoIds||[]);
          const nesta = alunosDaTurma.filter(a=>idsNaTurma.has(a.id));
          const outros = alunosDaTurma.filter(a=>!idsNaTurma.has(a.id));
          const linha = a => {
            const checked = idsNaTurma.has(a.id);
            return `<label style="display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--paper-line);border-radius:10px;cursor:pointer;">
              <input type="checkbox" data-action="toggle-aluno-turma" data-id="${a.id}" ${checked?'checked':''} />
              <span><strong>${esc(a.nome)}</strong><small class="muted" style="display:block;">${esc(a.login)}</small></span>
            </label>`;
          };
          return `
            <p class="muted" style="font-size:12.5px;margin-top:-8px;margin-bottom:10px;">${nesta.length} aluno(s) nesta turma.</p>
            <div style="display:grid;gap:10px;">
              ${nesta.length ? nesta.map(linha).join('') : '<p class="muted" style="margin:0;">Nenhum aluno nesta turma ainda.</p>'}
            </div>
            ${outros.length ? `
              <div class="section-head" style="margin-top:18px;margin-bottom:6px;"><h2 style="font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);">Outros alunos (marque para adicionar)</h2></div>
              <div style="display:grid;gap:10px;">${outros.map(linha).join('')}</div>
            ` : ''}
          `;
        })()}
      </div>

      <div class="card" style="margin-top:18px;">
        <div class="section-head"><h2 style="font-size:17px;">Resumo da turma</h2>
          ${papelAtual()==='gestao'?'<button class="btn danger small" id="btn-excluir-turma">Excluir turma</button>':''}
        </div>
        <p class="muted" style="margin:0;">${esc(turma?.nome||'')} · ${(turma?.alunoIds||[]).length} aluno(s) · ${(turma?.simuladoIds||[]).length} simulado(s) liberado(s)</p>
      </div>
    `}
  `;

  document.getElementById('form-nova-turma').addEventListener('submit', e=>{
    e.preventDefault();
    const nome = document.getElementById('turma-nome').value.trim();
    if (!nome) return;
    const turma = {id:uid(), nome, alunoIds:[], simuladoIds:[], criadoEm:Date.now()};
    state.turmas.unshift(turma);
    state.turmaSelecionadaId = turma.id;
    salvarDados();
    toast('Turma criada.');
    e.target.reset();
    render();
  });

  const select = document.getElementById('select-turma-gerenciar');
  if (select) select.addEventListener('change', ()=>{ state.turmaSelecionadaId = select.value; render(); });

  const editarTurma = document.getElementById('form-editar-turma');
  if (editarTurma) editarTurma.addEventListener('submit', e=>{
    e.preventDefault();
    const t = state.turmas.find(x=>x.id===state.turmaSelecionadaId);
    const nome = document.getElementById('editar-turma-nome').value.trim();
    if (!t || !nome) return;
    const repetida = state.turmas.some(x=>x.id!==t.id && x.nome.trim().toLowerCase()===nome.toLowerCase());
    if (repetida){ toast('Já existe uma turma com esse nome.'); return; }
    t.nome = nome;
    salvarDados();
    render();
  });

  content.querySelectorAll('[data-action="toggle-aluno-turma"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const t = state.turmas.find(x=>x.id===state.turmaSelecionadaId);
      const aluno = state.alunos.find(a=>a.id===el.dataset.id);
      if (!t || !aluno) return;
      if (!Array.isArray(t.alunoIds)) t.alunoIds=[];
      if (!Array.isArray(aluno.turmaIds)) aluno.turmaIds=[];
      if (el.checked){
        if (!t.alunoIds.includes(aluno.id)) t.alunoIds.push(aluno.id);
        if (!aluno.turmaIds.includes(t.id)) aluno.turmaIds.push(t.id);
      } else {
        t.alunoIds = t.alunoIds.filter(id=>id!==aluno.id);
        aluno.turmaIds = aluno.turmaIds.filter(id=>id!==t.id);
      }
      salvarDados();
      render();
    });
  });

  content.querySelectorAll('[data-action="toggle-simulado-turma"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const t = state.turmas.find(x=>x.id===state.turmaSelecionadaId);
      if (!t) return;
      if (!Array.isArray(t.simuladoIds)) t.simuladoIds=[];
      if (el.checked){
        if (!t.simuladoIds.includes(el.dataset.id)) t.simuladoIds.push(el.dataset.id);
      } else {
        t.simuladoIds = t.simuladoIds.filter(id=>id!==el.dataset.id);
      }
      salvarDados();
      render();
    });
  });

  const excluir = document.getElementById('btn-excluir-turma');
  if (excluir) excluir.addEventListener('click', ()=>{
    if(papelAtual()!=='gestao') return;
    const t = state.turmas.find(x=>x.id===state.turmaSelecionadaId);
    if (!t) return;
    if (!confirm(`Excluir a turma "${t.nome}"? Os alunos continuarão cadastrados, mas deixarão de pertencer a esta turma.`)) return;
    state.alunos.forEach(a=>{ if (Array.isArray(a.turmaIds)) a.turmaIds=a.turmaIds.filter(id=>id!==t.id); });
    state.turmas = state.turmas.filter(x=>x.id!==t.id);
    state.turmaSelecionadaId = state.turmas[0]?.id || null;
    salvarDados();
    toast('Turma excluída.');
    render();
  });
}

function renderTeacherSimulados(content){
  const editando = state.editingSimuladoId ? state.simulados.find(s=>s.id===state.editingSimuladoId) : null;
  content.innerHTML = `
    <form class="card panel-form" id="form-novo-simulado">
      <div class="section-head" style="margin-bottom:14px;"><h2 style="font-size:17px;">${editando?'Editar simulado':'Novo simulado'}</h2></div>
      <div class="grid-2">
        <div class="field"><label class="field-label">Título</label><input type="text" id="ns-titulo" placeholder="Ex.: Simulado — Relevo e Clima" value="${esc(editando?.titulo||'')}" required /></div>
        <div class="field"><label class="field-label">Descrição (opcional)</label><input type="text" id="ns-descricao" placeholder="Breve descrição para o aluno" value="${esc(editando?.descricao||'')}" /></div>
        <div class="field"><label class="field-label">Conteúdo</label><input type="text" id="ns-conteudo" placeholder="Ex.: Clima, Relevo, Cartografia" value="${esc(editando?.conteudo||'')}" required /></div>
        <div class="field"><label class="field-label">Instruções para o aluno</label><textarea id="ns-instrucoes" rows="2" placeholder="Orientações gerais do simulado...">${esc(editando?.instrucoes||'')}</textarea></div>
        <div class="field"><label class="field-label">Valor total</label><input type="number" id="ns-valor" min="0" max="1000" step="0.1" value="${editando?.valorTotal??10}" /><small class="muted">Usado para exibir a nota final.</small></div>
        <div class="field"><label class="field-label">Tempo limite (minutos)</label><input type="number" id="ns-tempo" min="0" max="600" value="${editando?.tempoMin||0}" /><small class="muted">0 = sem limite.</small></div>
        <div class="field"><label class="field-label">Máximo de tentativas</label><input type="number" id="ns-tentativas" min="0" max="99" value="${editando ? (editando.maxTentativas??1) : 1}" /><small class="muted">0 = ilimitado.</small></div>
        <div class="field" style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;">
          <input type="checkbox" id="ns-finalizar-saida" ${editando?.finalizarAoSair ? 'checked' : ''} />
          <div><label for="ns-finalizar-saida" style="font-weight:700;cursor:pointer;">Finalizar se o aluno sair da aba</label><small class="muted" style="display:block;margin-top:3px;">Ao trocar de aba, minimizar ou sair da página, a tentativa será encerrada automaticamente.</small></div>
        </div>
        <div class="field"><label class="field-label">Data de abertura</label><input type="datetime-local" id="ns-abertura" value="${editando?.abertura ? new Date(editando.abertura).toISOString().slice(0,16) : ''}" /></div>
        <div class="field"><label class="field-label">Data de encerramento</label><input type="datetime-local" id="ns-encerramento" value="${editando?.encerramento ? new Date(editando.encerramento).toISOString().slice(0,16) : ''}" /></div>
        <div class="field" style="display:flex;align-items:center;gap:10px;"><input type="checkbox" id="ns-aleatorio" ${editando ? (editando.aleatorio!==false?'checked':'') : 'checked'} /><label for="ns-aleatorio">Embaralhar questões e alternativas</label></div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;"><button class="btn pine" type="submit">${editando?'Salvar alterações':'Adicionar simulado'}</button>${editando?'<button class="btn ghost" type="button" id="btn-cancelar-edicao-simulado">Cancelar</button>':''}</div>
    </form>

    <div class="card">
      <p class="muted" style="font-size:12.5px;margin:0 0 14px;">Depois de criar um simulado, vá em <strong>Turmas</strong> para escolher quais turmas poderão acessá-lo.</p>
      ${simuladosVisiveis().length === 0 ? `<div class="empty-state">Nenhum simulado cadastrado ainda.</div>` :
        (()=>{
          const meusSimulados = simuladosVisiveis();
          const linhaSimulado = s => `
        <div class="list-row">
          <div class="info">
            <h4>${esc(s.titulo)} <span class="badge ${s.ativo?'on':'off'}" style="margin-left:6px;">${s.ativo?'Ativo':'Inativo'}</span></h4>
            <p>${esc(s.descricao||'—')} · ${perguntasDoSimulado(s.id).length} pergunta(s) · ${s.tempoMin? s.tempoMin+' min':'sem limite'} · ${s.maxTentativas? s.maxTentativas+' tentativa(s)':'tentativas ilimitadas'}</p>
          </div>
          <div class="row-actions">
            <label class="toggle-ativo" style="display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">
              <input type="checkbox" data-action="toggle-ativo" data-id="${s.id}" ${s.ativo?'checked':''} />
              <span>${s.ativo?'Ligado':'Desligado'}</span>
            </label>
            <span class="muted" style="font-size:12px;">Liberação por turma</span>
            <button class="btn ghost small" data-action="editar-simulado" data-id="${s.id}">Editar</button>
            <button class="btn ghost small" data-action="ir-perguntas" data-id="${s.id}">Perguntas</button>
            <button class="btn ghost small" data-action="duplicar-simulado" data-id="${s.id}">Duplicar</button>
            <button class="btn danger small" data-action="del-simulado" data-id="${s.id}">Excluir</button>
          </div>
        </div>`;
          const materiasProf = [...new Set(meusSimulados.map(s=>s.conteudo||'Geral'))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
          return materiasProf.map(materia=>`
            <div class="materia-grupo" style="margin-bottom:24px;">
              <h3 style="font-family:var(--font-display);font-size:16px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--paper-line);">${esc(materia)}
                <span class="badge off" style="margin-left:8px;">${meusSimulados.filter(s=>(s.conteudo||'Geral')===materia).length} simulado(s)</span>
              </h3>
              ${meusSimulados.filter(s=>(s.conteudo||'Geral')===materia).map(linhaSimulado).join('')}
            </div>
          `).join('');
        })()
      }
    </div>
  `;

  document.getElementById('form-novo-simulado').addEventListener('submit', async e=>{
    e.preventDefault();
    const titulo = document.getElementById('ns-titulo').value.trim();
    const descricao = document.getElementById('ns-descricao').value.trim();
    const conteudo = document.getElementById('ns-conteudo').value.trim() || 'Geral';
    const instrucoes = document.getElementById('ns-instrucoes').value.trim();
    const valorTotal = Math.max(0, Number(document.getElementById('ns-valor').value)||10);
    const tempoMin = Math.max(0, Number(document.getElementById('ns-tempo').value)||0);
    const maxTentativas = Math.max(0, Number(document.getElementById('ns-tentativas').value)||0);
    const abertura = document.getElementById('ns-abertura').value ? new Date(document.getElementById('ns-abertura').value).getTime() : null;
    const encerramento = document.getElementById('ns-encerramento').value ? new Date(document.getElementById('ns-encerramento').value).getTime() : null;
    const aleatorio = document.getElementById('ns-aleatorio').checked;
    const finalizarAoSair = document.getElementById('ns-finalizar-saida')?.checked === true;
    if (!titulo) return;
    if (abertura && encerramento && encerramento <= abertura) { toast('A data de encerramento deve ser depois da abertura.'); return; }
    const foiEdicao = !!state.editingSimuladoId;
    if (foiEdicao){
      const sim = state.simulados.find(s=>s.id===state.editingSimuladoId);
      if (!sim) return;
      Object.assign(sim,{titulo,descricao,conteudo,instrucoes,valorTotal,tempoMin,maxTentativas,abertura,encerramento,aleatorio,finalizarAoSair});
      state.editingSimuladoId=null;
    } else {
      const papel = papelAtual();
      const professorId = (papel==='professor' && state.professorAuthed) ? state.professorAuthed.id : null;
      state.simulados.unshift({id:uid(),titulo,descricao,conteudo,instrucoes,valorTotal,ativo:true,criadoEm:Date.now(),tempoMin,maxTentativas,abertura,encerramento,aleatorio,finalizarAoSair,professorId});
    }
    try{
      await salvarDados();
      render();
      toast(foiEdicao ? 'Simulado atualizado.' : 'Simulado adicionado.');
    }catch(err){
      console.error(err);
      toast('Não foi possível salvar o simulado.');
    }
  });

  const cancelarEdicao = document.getElementById('btn-cancelar-edicao-simulado');
  if (cancelarEdicao) cancelarEdicao.addEventListener('click',()=>{ state.editingSimuladoId=null; render(); });

  content.querySelectorAll('[data-action="editar-simulado"]').forEach(el=>{
    el.addEventListener('click',()=>{
      state.editingSimuladoId=el.dataset.id;
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });

  content.querySelectorAll('[data-action="toggle-ativo"]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const sim = state.simulados.find(s=>s.id===el.dataset.id);
      if (!sim) return;
      sim.ativo = el.checked;
      const texto = el.parentElement?.querySelector('span');
      if (texto) texto.textContent = sim.ativo ? 'Ligado' : 'Desligado';
      salvarDados();
      toast(sim.ativo ? 'Simulado ligado.' : 'Simulado desligado.');
      render();
    });
  });
  content.querySelectorAll('[data-action="duplicar-simulado"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const original = state.simulados.find(s=>s.id===el.dataset.id);
      if (!original) return;
      const novoId = uid();
      state.simulados.unshift({
        ...original,
        id: novoId,
        titulo: original.titulo + ' — cópia',
        ativo: false,
        criadoEm: Date.now()
      });
      const perguntasOriginais = perguntasDoSimulado(original.id);
      perguntasOriginais.forEach(p=>{
        state.perguntas.push({...p, id:uid(), simuladoId:novoId});
      });
      state.turmas.forEach(t=>{
        if (Array.isArray(t.simuladoIds) && t.simuladoIds.includes(original.id)) t.simuladoIds.push(novoId);
      });
      salvarDados();
      toast('Simulado duplicado.');
      render();
    });
  });

  content.querySelectorAll('[data-action="ir-perguntas"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.perguntasFiltroSimuladoId = el.dataset.id;
      state.teacherTab = 'perguntas';
      render();
    });
  });
  content.querySelectorAll('[data-action="del-simulado"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id=el.dataset.id;
      const sim=state.simulados.find(s=>s.id===id);
      if (!sim) return;
      if (!confirm(`Arquivar o simulado "${sim.titulo}"? Os resultados e as questões serão preservados.`)) return;
      sim.ativo=false;
      sim.arquivado=true;
      sim.arquivadoEm=Date.now();
      state.turmas.forEach(t=>t.simuladoIds=(t.simuladoIds||[]).filter(x=>x!==id));
      if (state.perguntasFiltroSimuladoId===id) state.perguntasFiltroSimuladoId=simuladosVisiveis()[0]?.id||null;
      salvarDados();
      toast('Simulado arquivado.');
      render();
    });
  });
}

          <div class="row-actions">
            <button class="btn ghost small" data-action="edit-pergunta" data-id="${p.id}">Editar</button>
            <button class="btn danger small" data-action="del-pergunta" data-id="${p.id}">Excluir</button>
          </div>
        </div>
      `).join('')}
    </div>
    ` : `<div class="empty-state">Cadastre um simulado primeiro na aba "Simulados".</div>`}
  `;

  const select = document.getElementById('select-simulado-perguntas');
  if (select) select.addEventListener('change', ()=>{
    state.perguntasFiltroSimuladoId = select.value;
    state.editingPerguntaId = null;
    state.novaPerguntaFotos = null;
    render();
  });

  const fotoInput = document.getElementById('pg-foto');
  const fotosPreview = document.getElementById('pg-fotos-preview');
  const fotosAtuais = fotosDaPergunta(editando);
  if (state.novaPerguntaFotos === null) state.novaPerguntaFotos = [...fotosAtuais];
  const atualizarPreviewsFotos = ()=>{
    if(!fotosPreview)return;
    fotosPreview.innerHTML = state.novaPerguntaFotos.map((foto,j)=>`<div data-foto-index="${j}" style="position:relative;"><img class="foto-preview" src="${foto}" alt="Prévia da foto ${j+1}" /><button type="button" class="btn ghost small pg-remover-foto" data-foto-index="${j}" style="margin-top:6px;">Remover</button></div>`).join('');
    fotosPreview.querySelectorAll('.pg-remover-foto').forEach(btn=>btn.addEventListener('click',()=>{
      state.novaPerguntaFotos.splice(Number(btn.dataset.fotoIndex),1);
      atualizarPreviewsFotos();
    }));
  };
  atualizarPreviewsFotos();
  if (fotoInput) fotoInput.addEventListener('change', async ()=>{
    const arquivos = Array.from(fotoInput.files || []).filter(file=>file.type.startsWith('image/'));
    if (!arquivos.length) return;
    try{
      const novas = await Promise.all(arquivos.map(file=>comprimirImagem(file)));
      state.novaPerguntaFotos.push(...novas);
      atualizarPreviewsFotos();
      fotoInput.value = '';
    }catch(err){ console.error(err); toast('Não foi possível carregar uma ou mais imagens.'); }
  });

  const tipoSelect=document.getElementById('pg-tipo');
  const tipoEditor=document.getElementById('editor-tipo-pergunta');
  function renderEditorTipo(){
    if(!tipoEditor)return;
    const tipo=tipoSelect.value;
    if(tipo==='multipla'){
      const ops=Array.isArray(editando?.opcoes)?editando.opcoes:[];
      tipoEditor.innerHTML=`<div class="field questao-editor-box">
        <label class="field-label">Alternativas — marque a correta</label>
        ${[0,1,2,3,4].map(i=>`<div class="opcao-row">
          <span class="letra">${String.fromCharCode(65+i)})</span>
          <input type="radio" name="pg-correta" value="${i}" ${(editando?.tipo||'multipla')==='multipla' ? (Number(editando?.respostaCorreta)===i?'checked':'') : (i===0?'checked':'' )} />
          <input type="text" id="pg-opcao-${i}" placeholder="Alternativa ${String.fromCharCode(65+i)}" value="${esc(ops[i]||'')}" required />
        </div>`).join('')}
      </div>`;
    }else if(tipo==='texto'){
      const aceitas=Array.isArray(editando?.respostasAceitas)&&editando.respostasAceitas.length ? editando.respostasAceitas : [editando?.respostaTexto||''];
      tipoEditor.innerHTML=`<div class="field questao-editor-box">
        <label class="field-label">Resposta correta</label>
        <textarea id="pg-resposta-texto" class="texto-resposta" placeholder="Ex.: Vitória&#10;Vitória - ES&#10;vitória">${esc(aceitas.join('\n'))}</textarea>
        <small class="muted">Você pode colocar várias respostas aceitas, uma por linha. A correção ignora maiúsculas, acentos e espaços extras.</small>
      </div>`;
    }else if(tipo==='verdadeiro_falso'){
      const rc=Number(editando?.respostaCorreta||0);
      tipoEditor.innerHTML=`<div class="field questao-editor-box">
        <label class="field-label">Resposta correta</label>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <label class="opcao"><input type="radio" name="pg-vf" value="0" ${rc===0?'checked':''}/> Verdadeiro</label>
          <label class="opcao"><input type="radio" name="pg-vf" value="1" ${rc===1?'checked':''}/> Falso</label>
        </div>
      </div>`;
    }else{
      const pares=Array.isArray(editando?.pares)&&editando.pares.length ? editando.pares : Array.from({length:4},()=>({esquerda:'',direita:'',correta:0}));
      tipoEditor.innerHTML=`<div class="field questao-editor-box">
        <label class="field-label">Associação — ligue cada bloco à sua respectiva localidade</label>
        <div class="matching-row" style="font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);"><strong>Bloco / item</strong><strong>Localidade / correspondência</strong></div>
        ${[0,1,2,3].map(i=>{
          const par=pares[i]||{esquerda:'',direita:'',correta:0};
          return `<div class="matching-row">
            <input type="text" id="pg-esq-${i}" placeholder="Ex.: Amazônia" value="${esc(par.esquerda||'')}" required />
            <input type="text" id="pg-dir-${i}" placeholder="Ex.: Região Norte" value="${esc(par.direita||'')}" required />
          </div>`;
        }).join('')}
        <div class="field" style="margin-top:12px;">
          <label class="field-label">Correspondências corretas</label>
          ${[0,1,2,3].map(i=>`<div class="matching-grid">
            <span class="matching-label">Item ${i+1}</span>
            <select id="pg-corr-${i}">
              ${[0,1,2,3].map(j=>`<option value="${j}" ${Number(pares[i]?.correta??i)===j?'selected':''}>Localidade ${j+1}</option>`).join('')}
            </select>
          </div>`).join('')}
        </div>
        <small class="muted">Exemplo: bloco “Amazônia” → “Região Norte”. No aluno, as opções aparecerão em menus para ligar cada bloco à sua correspondência.</small>
      </div>`;
    }
  }
  tipoSelect?.addEventListener('change',renderEditorTipo);
  renderEditorTipo();

  function sincronizarMetadadosResultado(perguntaId, descritor, habilidade){
    state.resultados = state.resultados.map(r=>{
      if(!Array.isArray(r.detalhes)) return r;
      let mudou=false;
      const detalhes=r.detalhes.map(d=>{
        if(d.perguntaId!==perguntaId) return d;
        if((d.descritor||'')===descritor && (d.habilidade||'')===habilidade) return d;
        mudou=true;
        return {...d, descritor, habilidade};
      });
      return mudou ? {...r, detalhes} : r;
    });
  }

  const form = document.getElementById('form-pergunta');
  if (form) form.querySelectorAll('input[type="text"], input[type="number"]').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if (e.key === 'Enter') e.preventDefault();
    });
  });
  if (form) form.addEventListener('submit', async e=>{
    e.preventDefault();
    const enunciado = document.getElementById('pg-enunciado').value.trim();
    const tipo = tipoSelect.value;
    const descritor = document.getElementById('pg-descritor').value.trim();
    const habilidade = document.getElementById('pg-habilidade')?.value.trim() || '';
    const textoApoio = document.getElementById('pg-texto-apoio')?.value.trim() || '';
    if (!enunciado) { toast('Escreva o enunciado da pergunta antes de salvar.'); return; }
    const fotos = Array.isArray(state.novaPerguntaFotos) ? [...state.novaPerguntaFotos] : fotosDaPergunta(editando);
    const payload = {simuladoId:state.perguntasFiltroSimuladoId,enunciado,textoApoio,tipo,descritor,habilidade,fotos,foto:fotos[0]||'',criadoEm:editando?.criadoEm||Date.now()};
    if(tipo==='multipla'){
      const opcoes=[0,1,2,3,4].map(i=>document.getElementById(`pg-opcao-${i}`).value.trim());
      const correta=Number(form.querySelector('input[name="pg-correta"]:checked')?.value);
      if(opcoes.some(o=>!o) || !Number.isFinite(correta)) return;
      Object.assign(payload,{opcoes,respostaCorreta:correta});
    }else if(tipo==='texto'){
      const respostasAceitas=document.getElementById('pg-resposta-texto').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
      if(!respostasAceitas.length)return;
      Object.assign(payload,{opcoes:[],respostaTexto:respostasAceitas[0],respostasAceitas,respostaCorreta:null});
    }else if(tipo==='verdadeiro_falso'){
      const correta=Number(form.querySelector('input[name="pg-vf"]:checked')?.value);
      if(!Number.isFinite(correta))return;
      Object.assign(payload,{opcoes:['Verdadeiro','Falso'],respostaCorreta:correta});
    }else{
      const pares=[0,1,2,3].map(i=>({
        esquerda:document.getElementById(`pg-esq-${i}`).value.trim(),
        direita:document.getElementById(`pg-dir-${i}`).value.trim(),
        correta:Number(document.getElementById(`pg-corr-${i}`).value)
      }));
      if(pares.some(x=>!x.esquerda||!x.direita||!Number.isFinite(x.correta)))return;
      Object.assign(payload,{opcoes:[],pares,respostaCorreta:null});
    }
    if (state.editingPerguntaId){
      const pergunta=state.perguntas.find(p=>p.id===state.editingPerguntaId);
      if(!pergunta)return;
      Object.assign(pergunta,payload);
      sincronizarMetadadosResultado(pergunta.id, descritor, habilidade);
      state.editingPerguntaId=null;
    }else{
      state.perguntas.push({id:uid(),...payload});
    }
    state.novaPerguntaFotos=null;
    await salvarDados();
    render();
  });

  const cancelBtn = document.getElementById('btn-cancelar-edicao');
  if (cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.editingPerguntaId=null; state.novaPerguntaFotos=null; render(); });

  content.querySelectorAll('[data-action="edit-pergunta"]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.editingPerguntaId = el.dataset.id; state.novaPerguntaFotos = null; render(); window.scrollTo({top:0,behavior:'smooth'}); });
  });
  content.querySelectorAll('[data-action="del-pergunta"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id=el.dataset.id;
      if (!confirm('Excluir esta pergunta? Ela também deixará de aparecer nos relatórios.')) return;
      state.perguntas = state.perguntas.filter(p=>p.id!==id);
      
      state.resultados = state.resultados.map(r=>{
        if(!Array.isArray(r.detalhes)) return r;
        const detalhes=r.detalhes.filter(d=>d.perguntaId!==id);
        const acertos=detalhes.filter(d=>d.acertou).length;
        const total=detalhes.length;
        return {...r,detalhes,acertos,total,nota:total?Number((acertos/total*10).toFixed(1)):0};
      });
      salvarDados();
      toast('Pergunta excluída.');
      render();
    });
  });
}

function renderTeacherResultados(content){
  content.innerHTML = `
    <div class="grid-2" style="margin-bottom:16px;">
      <div class="field" style="max-width:360px;">
        <label class="field-label">Turma dos relatórios</label>
        <select id="select-turma-relatorios"><option value="todas" ${state.relatorioTurmaId==='todas'?'selected':''}>Todas as turmas</option>${state.turmas.map(t=>`<option value="${t.id}" ${t.id===state.relatorioTurmaId?'selected':''}>${esc(t.nome)}</option>`).join('')}</select>
      </div>
    </div>
    <div class="subtabs" style="margin-bottom:18px;">
      <button data-rview="geral" class="${state.resultadosView==='geral'?'active':''}">Visão geral</button>
      <button data-rview="aluno" class="${state.resultadosView==='aluno'?'active':''}">Por aluno</button>
    </div>
    <div id="resultados-inner"></div>
  `;
  content.querySelectorAll('[data-rview]').forEach(b=>{
    b.addEventListener('click', ()=>{ state.resultadosView = b.dataset.rview; render(); });
  });

  const inner = document.getElementById('resultados-inner');
  if (state.resultadosView === 'aluno') renderResultadosPorAluno(inner);
  else renderResultadosGeral(inner);
}

function renderResultadosGeral(content){
  const filtro = state.resultadosFiltroSimuladoId;
  const filtroTurma = state.resultadosFiltroTurmaId;
  let resultados = resultadosDoRelatorioAtual();
  if (filtroTurma!=='todas') {
    const idsTurma = new Set(alunosFiltradosPorTurma(filtroTurma).map(a=>a.id));
    resultados = resultados.filter(r=>idsTurma.has(r.alunoId));
  }
  if (filtro!=='todos') resultados = resultados.filter(r=>r.simuladoId===filtro);

  const totalTentativas = resultados.length;
  const mediaAcertos = totalTentativas
    ? (resultados.reduce((acc,r)=>acc + (r.total? r.acertos/r.total : 0),0) / totalTentativas * 100)
    : 0;

  const porDescritor = {};
  const porHabilidade = {};
  const porPergunta = {};
  const porMateriaAluno = {};
  const perguntasMapaResultados = new Map(state.perguntas.map(p=>[p.id,p]));
  const simuladosMapaResultados = new Map(state.simulados.map(s=>[s.id,s]));
  resultados.forEach(r=>{
    const materia = simuladosMapaResultados.get(r.simuladoId)?.conteudo || 'Geral';
    if (!porMateriaAluno[materia]) porMateriaAluno[materia] = {};
    if (!porMateriaAluno[materia][r.alunoId]) porMateriaAluno[materia][r.alunoId] = {nome:r.alunoNome,acertos:0,total:0};
    porMateriaAluno[materia][r.alunoId].acertos += r.acertos;
    porMateriaAluno[materia][r.alunoId].total += r.total;
    (r.detalhes||[]).forEach(d=>{
      const perguntaAtual = perguntasMapaResultados.get(d.perguntaId);
      const desc = perguntaAtual?.descritor || d.descritor || 'Sem descritor';
      const hab = perguntaAtual?.habilidade || d.habilidade || 'Sem habilidade';
      if (!porDescritor[desc]) porDescritor[desc] = {erros:0, total:0};
      porDescritor[desc].total++; if (!d.acertou) porDescritor[desc].erros++;
      if (!porHabilidade[hab]) porHabilidade[hab] = {erros:0,total:0};
      porHabilidade[hab].total++; if (!d.acertou) porHabilidade[hab].erros++;
      const key = d.perguntaId + '||' + d.enunciado;
      if (!porPergunta[key]) porPergunta[key] = {enunciado:perguntaAtual?.enunciado || d.enunciado, descritor:perguntaAtual?.descritor || d.descritor || '', habilidade:perguntaAtual?.habilidade || d.habilidade || '', erros:0, total:0};
      porPergunta[key].total++; if (!d.acertou) porPergunta[key].erros++;
    });
  });

  const descritoresOrdenados = Object.entries(porDescritor)
    .map(([desc,v])=>({desc, ...v, pct: v.total? Math.round(v.erros/v.total*100):0}))
    .sort((a,b)=>b.pct-a.pct || b.erros-a.erros);

  const perguntasOrdenadas = Object.values(porPergunta)
    .map(v=>({...v, pct: v.total? Math.round(v.erros/v.total*100):0}))
    .sort((a,b)=>b.erros-a.erros)
    .slice(0,10);

  content.innerHTML = `
    <div class="grid-2" style="margin-bottom:14px;">
    <div class="field" style="max-width:360px;">
      <label class="field-label">Filtrar por turma</label>
      <select id="select-turma-resultados"><option value="todas" ${filtroTurma==='todas'?'selected':''}>Todas as turmas</option>${state.turmas.map(t=>`<option value="${t.id}" ${t.id===filtroTurma?'selected':''}>${esc(t.nome)}</option>`).join('')}</select>
    </div>
    <div class="field" style="max-width:360px;">
      <label class="field-label">Filtrar por simulado</label>
      <select id="select-simulado-resultados">
        <option value="todos" ${filtro==='todos'?'selected':''}>Todos os simulados</option>
        ${simuladosVisiveis().map(s=>`<option value="${s.id}" ${s.id===filtro?'selected':''}>${esc(s.titulo)}</option>`).join('')}
      </select>
    </div></div>

    <div class="stat-cards">
      <div class="card stat-card"><div class="num">${totalTentativas}</div><div class="lbl">Tentativas</div></div>
      <div class="card stat-card"><div class="num">${mediaAcertos.toFixed(0)}%</div><div class="lbl">Média de acertos</div></div>
      <div class="card stat-card"><div class="num">${descritoresOrdenados.length}</div><div class="lbl">Descritores avaliados</div></div>
    </div>

    <div class="section-head"><h2 style="font-size:17px;">Descritores com mais erros (turma toda)</h2></div>
    <div class="card" style="padding:18px;margin-bottom:24px;">
      ${descritoresOrdenados.length===0?'<p class="muted">Ainda não há respostas registradas.</p>':
        descritoresOrdenados.map(d=>`
        <div class="bar-row">
          <div class="label" title="${esc(d.desc)}">${esc(d.desc)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${d.pct}%"></div></div>
          <div class="pct">${d.pct}%</div>
        </div>
      `).join('')}
    </div>

    <div class="section-head"><h2 style="font-size:17px;">Habilidades com mais erros</h2></div>
    <div class="card" style="padding:18px;margin-bottom:24px;">
      ${Object.entries(porHabilidade).map(([hab,v])=>({hab,...v,pct:v.total?Math.round(v.erros/v.total*100):0})).sort((a,b)=>b.pct-a.pct||b.erros-a.erros).map(h=>`
        <div class="bar-row"><div class="label" title="${esc(h.hab)}">${esc(h.hab)}</div><div class="bar-track"><div class="bar-fill" style="width:${h.pct}%"></div></div><div class="pct">${h.pct}%</div></div>`).join('') || '<p class="muted">Ainda não há habilidades cadastradas.</p>'}
    </div>

    <div class="section-head"><h2 style="font-size:17px;">Perguntas mais erradas</h2></div>
    <div class="card" style="margin-bottom:24px;">
      ${perguntasOrdenadas.length===0?`<div class="empty-state">Sem dados ainda.</div>`:`
      <table class="data-table">
        <thead><tr><th>Pergunta</th><th>Descritor</th><th>Habilidade</th><th>Erros</th></tr></thead>
        <tbody>
          ${perguntasOrdenadas.map(p=>`
            <tr><td>${esc(p.enunciado)}</td><td>${p.descritor?esc(p.descritor):'<span class="muted">—</span>'}</td><td>${p.habilidade?esc(p.habilidade):'<span class="muted">—</span>'}</td><td>${p.erros}/${p.total} (${p.pct}%)</td></tr>
          `).join('')}
        </tbody>
      </table>`}
    </div>

    <div class="section-head"><h2 style="font-size:17px;">Ranking por matéria</h2></div>
    <div class="card" style="padding:8px 18px;margin-bottom:24px;">
      ${Object.entries(porMateriaAluno).map(([materia,alunos])=>{
        const ranking=Object.values(alunos).map(a=>({label:a.nome,value:a.total?Math.round(a.acertos/a.total*100):0})).sort((a,b)=>b.value-a.value);
        return `<div style="margin-bottom:18px;"><h3 style="font-family:var(--font-display);font-size:15px;margin:10px 0;">${esc(materia)}</h3>${rankingList(ranking,{color:'var(--pine)',emptyMsg:'Sem resultados.'})}</div>`;
      }).join('') || '<div class="empty-state">Nenhum resultado por matéria ainda.</div>'}
    </div>

    <div class="section-head"><h2 style="font-size:17px;">Ranking geral dos alunos</h2></div>
    <div class="card" style="padding:8px 18px;margin-bottom:24px;">
      ${rankingList(Object.values((()=>{const m={}; resultados.forEach(r=>{if(!m[r.alunoId])m[r.alunoId]={nome:r.alunoNome,a:0,t:0};m[r.alunoId].a+=r.acertos;m[r.alunoId].t+=r.total;});return m;})()).map(a=>({label:a.nome,value:a.t?Math.round(a.a/a.t*100):0})).sort((a,b)=>b.value-a.value),{color:'var(--pine)',emptyMsg:'Nenhum resultado registrado ainda.'})}
    </div>

    <div class="section-head"><h2 style="font-size:17px;">Tentativas dos alunos</h2></div>
    <div class="card">
      ${resultados.length===0?`<div class="empty-state">Nenhuma tentativa registrada.</div>`:
        resultados.map(r=>`
        <div class="list-row">
          <div class="info">
            <h4>${esc(r.alunoNome)} — ${esc(r.simuladoTitulo)}</h4>
            <p>${new Date(r.data).toLocaleString('pt-BR')} · ${r.acertos}/${r.total} acertos · nota ${r.nota ?? (r.total ? (r.acertos/r.total*10).toFixed(1) : '0')}</p>
          </div>
          <div class="row-actions">
  <button class="btn ghost small" data-action="reset-tentativa" data-id="${r.id}">Resetar tentativa</button>
  ${papelAtual()==='gestao' ? `<button class="btn danger small" data-action="excluir-tentativa" data-id="${r.id}">Excluir permanentemente</button>` : ''}
</div>
        </div>
      `).join('')}
    </div>
  `;

  function limparTentativaSalva(alunoId, simuladoId){
    try{
      const salvo=JSON.parse(localStorage.getItem('estadoSite')||'null');
      if(!salvo) return;
      if(salvo.quizSimuladoId===simuladoId){
        salvo.quizSimuladoId=null; salvo.quizRespostas={}; salvo.quizPerguntaIds=[];
        salvo.quizFimEm=null; salvo.quizIniciadoEm=null; salvo.quizOrdemOpcoes={}; salvo.quizResultado=null;
        localStorage.setItem('estadoSite',JSON.stringify(salvo));
      }
    }catch(_){ }
    if(state.alunoAuthed?.id===alunoId && state.quizSimuladoId===simuladoId){
      state.quizSimuladoId=null; state.quizRespostas={}; state.quizPerguntaIds=[];
      state.quizFimEm=null; state.quizIniciadoEm=null; state.quizOrdemOpcoes={}; state.quizResultado=null;
    }
  }
  async function excluirTentativaPorId(id, modo='excluir'){
    const r=state.resultados.find(x=>x.id===id);
    if(!r) return;
    const mensagem=modo==='reset'
      ? `Resetar a tentativa de ${r.alunoNome} no simulado "${r.simuladoTitulo}"? O registro será removido e o aluno poderá tentar novamente se houver tentativas disponíveis.`
      : `Excluir permanentemente a tentativa de ${r.alunoNome} no simulado "${r.simuladoTitulo}"?`;
    if(!confirm(mensagem)) return;
    state.resultados=state.resultados.filter(x=>x.id!==id);
    limparTentativaSalva(r.alunoId,r.simuladoId);
    await salvarDados();
    salvarEstadoLocal();
    render();
  }

function renderResultadosPorAluno(content){
  if (!state.resultadosFiltroAlunoId && state.alunos.length){

  }
  const alunosResultados = alunosFiltradosPorTurma(state.resultadosFiltroTurmaId);
  if (!state.resultadosFiltroAlunoId || !alunosResultados.some(a=>a.id===state.resultadosFiltroAlunoId)) state.resultadosFiltroAlunoId = alunosResultados[0]?.id || null;
  const aluno = alunosResultados.find(a=>a.id===state.resultadosFiltroAlunoId);

    <div class="grid-2">
    <div class="field" style="max-width:360px;"><label class="field-label">Filtrar por turma</label><select id="select-turma-resultados-aluno"><option value="todas" ${state.resultadosFiltroTurmaId==='todas'?'selected':''}>Todas as turmas</option>${state.turmas.map(t=>`<option value="${t.id}" ${t.id===state.resultadosFiltroTurmaId?'selected':''}>${esc(t.nome)}</option>`).join('')}</select></div>
    <div class="field" style="max-width:360px;">
      <label class="field-label">Selecionar aluno</label>
      <select id="select-aluno-resultados">
        ${alunosResultados.length===0?'<option value="">Nenhum aluno cadastrado</option>':''}
        ${alunosResultados.map(a=>`<option value="${a.id}" ${a.id===state.resultadosFiltroAlunoId?'selected':''}>${esc(a.nome)}</option>`).join('')}
      </select>
    </div></div>
    <div id="aluno-resultados-body"></div>

  });
