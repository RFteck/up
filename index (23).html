    body.innerHTML = `<div class="empty-state">Cadastre um aluno na aba "Alunos" para ver os resultados dele aqui.</div>`;
    return;
  }
  if (resultados.length === 0){
    body.innerHTML = `<div class="empty-state">${esc(aluno.nome)} ainda não fez nenhum simulado.</div>`;
    return;
  }

  const totalTentativas = resultados.length;
  const mediaAcertos = (resultados.reduce((acc,r)=>acc + (r.total? r.acertos/r.total : 0),0) / totalTentativas * 100);

  const porSimulado = {};
  resultados.forEach(r=>{
    if (!porSimulado[r.simuladoId]) porSimulado[r.simuladoId] = {titulo:r.simuladoTitulo, tentativas:[]};
    porSimulado[r.simuladoId].tentativas.push(r);
  });
  const simuladosResumo = Object.values(porSimulado).map(s=>{
    const ordenadas = [...s.tentativas].sort((a,b)=>b.data-a.data);
    const ultima = ordenadas[0];
    const melhor = [...s.tentativas].sort((a,b)=> (b.acertos/b.total) - (a.acertos/a.total))[0];
    return {titulo:s.titulo, qtd:s.tentativas.length, ultima, melhor};
  });

  const porDescritor = {};
  const porHabilidade = {};
  resultados.forEach(r=>{
    (r.detalhes||[]).forEach(d=>{
      const desc = d.descritor || 'Sem descritor';
      const hab = d.habilidade || 'Sem habilidade';
      if (!porDescritor[desc]) porDescritor[desc] = {erros:0, total:0};
      porDescritor[desc].total++; if (!d.acertou) porDescritor[desc].erros++;
      if (!porHabilidade[hab]) porHabilidade[hab] = {erros:0,total:0};
      porHabilidade[hab].total++; if (!d.acertou) porHabilidade[hab].erros++;
    });
  });
  const descritoresOrdenados = Object.entries(porDescritor)
    .map(([desc,v])=>({desc, ...v, pct: v.total? Math.round(v.erros/v.total*100):0}))
    .filter(d=>d.erros>0)

  body.innerHTML = `
    <div class="stat-cards">
      <div class="card stat-card"><div class="num">${totalTentativas}</div><div class="lbl">Tentativas</div></div>
      <div class="card stat-card"><div class="num">${mediaAcertos.toFixed(0)}%</div><div class="lbl">Média de acertos</div></div>
      <div class="card stat-card"><div class="num">${descritoresOrdenados.length}</div><div class="lbl">Descritores com erro</div></div>
    </div>

    <div class="section-head"><h2 style="font-size:17px;">Simulados feitos por ${esc(aluno.nome)}</h2></div>
    <div class="card" style="margin-bottom:24px;">
      ${simuladosResumo.map(s=>`
        <div class="list-row">
          <div class="info">
            <h4>${esc(s.titulo)}</h4>
            <p>${s.qtd} tentativa(s) · melhor resultado: ${s.melhor.acertos}/${s.melhor.total} · última: ${s.ultima.acertos}/${s.ultima.total} em ${new Date(s.ultima.data).toLocaleDateString('pt-BR')}</p>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="section-head"><h2 style="font-size:17px;">Descritores em que ${esc(aluno.nome)} mais errou</h2></div>
    <div class="card" style="padding:18px;margin-bottom:24px;">
      ${descritoresOrdenados.length===0?'<p class="muted">Nenhum erro registrado — ótimo desempenho!</p>':
        descritoresOrdenados.map(d=>`
        <div class="bar-row">
          <div class="label" title="${esc(d.desc)}">${esc(d.desc)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${d.pct}%"></div></div>
          <div class="pct">${d.erros}/${d.total}</div>
        </div>
      `).join('')}
    </div>

    <div class="section-head"><h2 style="font-size:17px;">Habilidades com mais dificuldade</h2></div>
    <div class="card" style="padding:8px 18px;margin-bottom:24px;">${rankingList(Object.entries(porHabilidade).map(([hab,v])=>({label:hab,value:v.total?Math.round(v.erros/v.total*100):0})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value),{color:'var(--accent)',emptyMsg:'Nenhum erro registrado — ótimo desempenho!'})}</div>

    <div class="section-head"><h2 style="font-size:17px;">Histórico de tentativas</h2></div>
    <div class="card">
      ${[...resultados].sort((a,b)=>b.data-a.data).map(r=>`
        <div class="list-row">
          <div class="info">
            <h4>${esc(r.simuladoTitulo)}</h4>
            <p>${new Date(r.data).toLocaleString('pt-BR')} · ${r.acertos}/${r.total} acertos</p>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function agregarResultados(resultados){
  const porDescritor = {};
  const porHabilidade = {};
  const porPergunta = {};
  const porAluno = {};
  const porSimulado = {};
  const porMateriaAluno = {};
  const simMapa = new Map(state.simulados.map(s=>[s.id,s]));
  const pergMapa = new Map(state.perguntas.map(p=>[p.id,p]));
  resultados.forEach(r=>{
    if (!porAluno[r.alunoId]) porAluno[r.alunoId] = {nome:r.alunoNome, acertos:0, total:0, tentativas:0};
    porAluno[r.alunoId].acertos += r.acertos;
    porAluno[r.alunoId].total += r.total;
    porAluno[r.alunoId].tentativas++;
    const materia=simMapa.get(r.simuladoId)?.conteudo || 'Geral';
    if(!porMateriaAluno[materia])porMateriaAluno[materia]={};
    if(!porMateriaAluno[materia][r.alunoId])porMateriaAluno[materia][r.alunoId]={nome:r.alunoNome,acertos:0,total:0};
    porMateriaAluno[materia][r.alunoId].acertos+=r.acertos;
    porMateriaAluno[materia][r.alunoId].total+=r.total;
    if (!porSimulado[r.simuladoId]) porSimulado[r.simuladoId] = {titulo:r.simuladoTitulo, acertos:0, total:0, tentativas:0};
    porSimulado[r.simuladoId].acertos += r.acertos;
    porSimulado[r.simuladoId].total += r.total;
    porSimulado[r.simuladoId].tentativas++;
    (r.detalhes||[]).forEach(d=>{
      const p=pergMapa.get(d.perguntaId);
      const desc = p?.descritor || d.descritor || 'Sem descritor';
      const hab = p?.habilidade || d.habilidade || 'Sem habilidade';
      if (!porDescritor[desc]) porDescritor[desc] = {erros:0, total:0};
      porDescritor[desc].total++; if (!d.acertou) porDescritor[desc].erros++;
      if (!porHabilidade[hab]) porHabilidade[hab] = {erros:0, total:0};
      porHabilidade[hab].total++; if (!d.acertou) porHabilidade[hab].erros++;
      const key = d.perguntaId + '||' + d.enunciado;
      if (!porPergunta[key]) porPergunta[key] = {enunciado:p?.enunciado || d.enunciado, descritor:p?.descritor || d.descritor || '', habilidade:p?.habilidade || d.habilidade || '', erros:0, total:0};
      porPergunta[key].total++; if (!d.acertou) porPergunta[key].erros++;
    });
  });
  return {porDescritor, porHabilidade, porPergunta, porAluno, porSimulado, porMateriaAluno};
}

function emptyReport(msg){
  return `<div class="empty-state">${esc(msg)}</div>`;
}

function corPorDificuldade(valor, modo='acerto'){
  const v = modo==='erro' ? (100-valor) : valor;
  if (v < 50) return 'var(--alert)';
  if (v < 70) return 'var(--ochre)';
  return 'var(--pine)';
}

function chartBarVertical(items, opts={}){
  if (!items.length) return emptyReport(opts.emptyMsg || 'Sem dados suficientes ainda.');
  const unit = opts.unit ?? '%';
  const max = opts.max ?? 100;
  const color = opts.color ?? 'var(--pine)';
  return `<div class="chart-bars">
    ${items.map(it=>{
      const pct = max ? Math.max(2, Math.round((it.value/max)*100)) : 0;
      const cor = it.color || (opts.colorize ? corPorDificuldade(it.value, opts.colorizeModo||'acerto') : color);
      const amostra = it.count!=null ? `<div class="chart-bar-n">n=${it.count}</div>` : '';
      return `
      <div class="chart-bar-col" title="${esc(it.title || it.label)}: ${it.value}${unit}${it.count!=null?` (${it.count} resposta(s))`:''}">
        <div class="chart-bar-value">${it.value}${unit}</div>
        <div class="chart-bar-track"><div class="chart-bar-fill" style="height:${pct}%;background:${cor}"></div></div>
        ${amostra}
        <div class="chart-bar-label">${esc(it.label)}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function svgLineChart(pontos){
  if (!pontos.length) return emptyReport('Sem dados suficientes ainda.');
  const w = 680, h = 240, padL = 40, padR = 16, padT = 16, padB = 34;
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;
  const n = pontos.length;
  const stepX = n>1 ? innerW/(n-1) : 0;
  const coords = pontos.map((p,i)=>{
    const x = padL + stepX*i;
    const y = padT + innerH - (Math.max(0,Math.min(100,p.value))/100)*innerH;
    return {x, y, ...p};
  });
  const pathD = coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${coords[coords.length-1].x.toFixed(1)},${(padT+innerH).toFixed(1)} L${coords[0].x.toFixed(1)},${(padT+innerH).toFixed(1)} Z`;
  const grid = [0,25,50,75,100].map(v=>{
    const y = padT + innerH - (v/100)*innerH;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--paper-line)" stroke-width="1"/><text x="${padL-8}" y="${(y+3).toFixed(1)}" font-size="10" text-anchor="end" fill="var(--ink-soft)" font-family="monospace">${v}</text>`;
  }).join('');
  const skip = Math.max(1, Math.ceil(n/12));
  const labels = coords.map((c,i)=> (i%skip===0 || i===n-1) ? `<text x="${c.x.toFixed(1)}" y="${h-10}" font-size="9" text-anchor="middle" fill="var(--ink-soft)" font-family="monospace">${esc(c.label)}</text>` : '').join('');
  const dots = coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3.5" fill="var(--pine-dark)"><title>${esc(c.label)}: ${c.value}%</title></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
    ${grid}
    <path d="${areaD}" fill="var(--pine-tint)" stroke="none" opacity="0.6"/>
    <path d="${pathD}" fill="none" stroke="var(--pine)" stroke-width="2.5"/>
    ${dots}
    ${labels}
  </svg>`;
}

function rankingList(items, opts={}){
  if (!items.length) return emptyReport(opts.emptyMsg || 'Sem dados suficientes ainda.');
  const unit = opts.unit ?? '%';
  const color = opts.color ?? 'var(--alert)';
  return items.map((it,i)=>`
    <div class="rank-row">
      <div class="rank-pos">${i+1}º</div>
      <div class="rank-info">
        <div class="rank-label" title="${esc(it.title||it.label)}">${esc(it.label)}${it.count!=null?` <span class="rank-n">(${it.count} resposta(s))</span>`:''}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${it.value}%;background:${it.color || (opts.colorize?corPorDificuldade(it.value,opts.colorizeModo||'erro'):color)}"></div></div>
      </div>
      <div class="rank-value">${it.value}${unit}</div>
    </div>
  `).join('');
}

function renderRelDistribuicaoNotas(content){
  const resultados = resultadosDoRelatorioAtual();
  const faixas = [
    {label:'0–2', min:0, max:2, color:'var(--alert)'},
    {label:'2–4', min:2, max:4, color:'var(--alert)'},
    {label:'4–6', min:4, max:6, color:'var(--ochre)'},
    {label:'6–8', min:6, max:8, color:'var(--ochre)'},
    {label:'8–10', min:8, max:10.0001, color:'var(--pine)'},
  ];
  const contagem = faixas.map(f=>0);
  resultados.forEach(r=>{
    const nota = Number(r.nota)||0;
    const idx = faixas.findIndex(f=>nota>=f.min && nota<f.max);
    if (idx>=0) contagem[idx]++;
  });
  const maxContagem = Math.max(1, ...contagem);
  const itens = faixas.map((f,i)=>({label:f.label, value:contagem[i], color:f.color, title:`Nota ${f.label}: ${contagem[i]} tentativa(s)`}));
  const total = resultados.length;
  const abaixoDaMedia = contagem[0]+contagem[1]+contagem[2];
  content.innerHTML = `

            <h4>${esc(s.titulo)}</h4>
            <p>${s.qtd} tentativa(s) · melhor: ${s.melhor.acertos}/${s.melhor.total} · última: ${s.ultima.acertos}/${s.ultima.total} em ${new Date(s.ultima.data).toLocaleDateString('pt-BR')}</p>

}

(function(){
  function alvoEditavel(el){
    return el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.isContentEditable);
  }
  ['copy','cut'].forEach(evt=>{
    document.addEventListener(evt, e=>{
      if(!alvoEditavel(e.target)){ e.preventDefault(); }
    });
  });
  document.addEventListener('contextmenu', e=>{
    if(!alvoEditavel(e.target)){ e.preventDefault(); }
  });
  document.addEventListener('selectstart', e=>{
    if(!alvoEditavel(e.target)){ e.preventDefault(); }
  });
  document.addEventListener('keydown', e=>{
    const k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey) && (k==='c'||k==='x'||k==='u'||k==='s') && !alvoEditavel(e.target)){
      e.preventDefault();
    }
  });
})();

(function(){
  function abrirLightbox(src, alt){
    const overlay=document.createElement('div');
    overlay.className='fx-lightbox';
    overlay.innerHTML=`<button type="button" class="fx-lightbox-close" aria-label="Fechar">✕</button><img src="${src}" alt="${esc(alt||'')}" />`;
    function fechar(){ overlay.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e){ if(e.key==='Escape') fechar(); }
    overlay.addEventListener('click', e=>{ if(e.target===overlay) fechar(); });
    overlay.querySelector('.fx-lightbox-close').addEventListener('click', fechar);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
  }
  document.addEventListener('click', e=>{
    const img=e.target.closest('.question-photo img');
    if(img) abrirLightbox(img.src, img.alt);
  });
})();

const FEATURE_KEY = 'recursosSiteV1';
function featureData(){ try{return JSON.parse(localStorage.getItem(FEATURE_KEY)||'{}')}catch{return {}} }
function saveFeatureData(d){localStorage.setItem(FEATURE_KEY,JSON.stringify(d))}
function alunoAtualId(){return state.alunoAuthed?.id||null}
function escapeHtml(v){return esc(v==null?'':String(v))}

const _simuladoPodeSerIniciadoOriginal = simuladoPodeSerIniciado;
simuladoPodeSerIniciado = function(simulado, aluno){
  const r = _simuladoPodeSerIniciadoOriginal(simulado, aluno);
  if(!r.ok) return r;
  if(simulado && simulado.codigoAcesso){
    const chave='codigo_'+simulado.id;
    const d=featureData();
    if(d[chave]!==simulado.codigoAcesso){
      const digitado=prompt('Código de acesso do simulado:');
      if(digitado===null) return {ok:false,motivo:'Acesso cancelado.'};
      if(digitado.trim()!==simulado.codigoAcesso) return {ok:false,motivo:'Código de acesso incorreto.'};
      d[chave]=digitado.trim(); saveFeatureData(d);
    }
  }
  return r;
};

const _renderAlunoOriginal = renderAluno;

  const meus=state.resultados.filter(r=>r.alunoId===aluno.id);

  const painel=document.createElement('div');

  <div class="field"><label class="field-label">Histórico</label><select id="aluno-historico"><option value="">Selecione um simulado</option>${meus.map(r=>`<option value="${r.id}">${escapeHtml(r.simuladoTitulo)} — ${Number(r.nota||0).toFixed(1)}</option>`).join('')}</select></div>
  <div id="aluno-historico-detalhe" style="margin-top:12px"></div>`;

    if(!r){box.innerHTML='';return}
    const erros=(r.detalhes||[]).filter(d=>!d.acertou);
    box.innerHTML=`<div class="card" style="padding:14px"><strong>${escapeHtml(r.simuladoTitulo)}</strong><p class="muted">${r.acertos}/${r.total} acertos · nota ${Number(r.nota||0).toFixed(1)}</p>${erros.length?`<details><summary>Revisar ${erros.length} questão(ões) errada(s)</summary><div style="margin-top:10px">${erros.map((d,i)=>`<div style="padding:10px 0;border-top:1px solid var(--paper-line)"><strong>${i+1}. ${escapeHtml(d.enunciado)}</strong><p style="margin:5px 0">Sua resposta: ${d.respostaAluno==null?'Não respondida':escapeHtml(d.opcoes?.[d.respostaAluno])}</p><p style="margin:0">Resposta correta: ${escapeHtml(d.opcoes?.[d.respostaCorreta])}</p></div>`).join('')}</div></details>`:'<span class="muted">Nenhum erro neste resultado.</span>'}</div>`;
  });
};

const _renderQuizOriginal = renderQuiz;
renderQuiz = function(){
  _renderQuizOriginal();
  if(!state.quizSimuladoId) return;
  const d=featureData(); const key='marcadas_'+alunoAtualId()+'_'+state.quizSimuladoId; const marcadas=new Set(d[key]||[]);
  document.querySelectorAll('.question-card').forEach(card=>{
    const texto=card.querySelector('.enunciado'); if(!texto) return;
    const num=card.querySelector('.qnum'); const idx=Number((num?.textContent.match(/Questão (\d+)/)||[])[1]||0)-1;
    const qid=state.quizPerguntaIds[idx]; if(!qid) return;
    const marcadaAgora=marcadas.has(qid);
    card.classList.toggle('marcada', marcadaAgora);
    const b=document.createElement('button'); b.type='button'; b.className='btn ghost small btn-marcar'; b.style.marginBottom='10px'; b.textContent=marcadaAgora?'★ Desmarcar revisão':'☆ Marcar para revisar';
    b.onclick=()=>{
      const dd=featureData();const kk=key;const a=new Set(dd[kk]||[]);
      if(a.has(qid)) a.delete(qid); else a.add(qid);
      dd[kk]=[...a]; saveFeatureData(dd);
      const ativa=a.has(qid);
      b.textContent=ativa?'★ Desmarcar revisão':'☆ Marcar para revisar';
      card.classList.toggle('marcada', ativa);
    };
    texto.insertAdjacentElement('beforebegin',b);
  });
};

const _renderTeacherAlunosOriginal=renderTeacherAlunos;
renderTeacherAlunos=function(content){
  _renderTeacherAlunosOriginal(content);
  const rows=content.querySelectorAll('.list-row');
  if(!rows.length)return;
  const busca=document.createElement('div'); busca.className='field'; busca.style.marginBottom='14px'; busca.innerHTML='<label class="field-label">Pesquisar alunos</label><input id="fx-busca-aluno" placeholder="Nome ou login">';
  content.insertBefore(busca, content.firstElementChild || null);
  busca.querySelector('input').addEventListener('input',e=>{const q=e.target.value.toLowerCase();rows.forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')});
};

const _renderTeacherRelatoriosOriginal=renderTeacherRelatorios;
renderTeacherRelatorios=function(content){
  _renderTeacherRelatoriosOriginal(content);
  const r=resultadosDoRelatorioAtual(); const por={};
  r.forEach(x=>{const s=state.simulados.find(y=>y.id===x.simuladoId);const c=s?.conteudo||'Geral';if(!por[c])por[c]={a:0,t:0};por[c].a+=x.acertos;por[c].t+=x.total;});
  const card=document.createElement('div');card.className='card';card.style.cssText='margin-top:16px;padding:18px';
  card.innerHTML='<div class="section-head"><h2 style="font-size:17px;margin:0">Desempenho por conteúdo</h2></div>'+(Object.keys(por).length?Object.entries(por).sort((a,b)=>(b[1].a/b[1].t)-(a[1].a/a[1].t)).map(([c,v])=>`<div class="bar-row"><div class="label">${escapeHtml(c)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v.a/v.t*100)}%"></div></div><div class="pct">${Math.round(v.a/v.t*100)}%</div></div>`).join(''):'<p class="muted">Ainda não há resultados.</p>');
  content.appendChild(card);
};

</script>
